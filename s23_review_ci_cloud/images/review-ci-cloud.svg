<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Review, CI &amp; Cloud — the same loop, driven unattended</text>

  <!-- Drivers (who drives the loop) -->
  <rect x="36" y="88" width="176" height="66" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="124" y="112" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">codex review</text>
  <text x="124" y="130" fill="#64748b" font-size="11" text-anchor="middle">point the loop at a git diff</text>
  <text x="124" y="145" fill="#64748b" font-size="10" text-anchor="middle">--uncommitted · --base · --commit</text>

  <rect x="36" y="170" width="176" height="66" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="124" y="194" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">codex exec</text>
  <text x="124" y="212" fill="#64748b" font-size="11" text-anchor="middle">headless, one task</text>
  <text x="124" y="227" fill="#64748b" font-size="10" text-anchor="middle">--json · --output-schema</text>

  <rect x="36" y="252" width="176" height="66" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="124" y="276" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">CI · Codex Cloud</text>
  <text x="124" y="294" fill="#64748b" font-size="11" text-anchor="middle">GitHub Action · cloud task</text>
  <text x="124" y="309" fill="#64748b" font-size="10" text-anchor="middle">isolated env → diff / PR</text>

  <!-- The loop (unchanged) -->
  <rect x="280" y="140" width="190" height="110" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="375" y="168" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">The Agent Loop (s01)</text>
  <text x="375" y="188" fill="#93c5fd" font-size="11" text-anchor="middle">model + read-only shell</text>
  <text x="375" y="206" fill="#93c5fd" font-size="11" text-anchor="middle">review system prompt</text>
  <text x="375" y="228" fill="#6b7280" font-size="10" font-anchor="middle" text-anchor="middle">unchanged — just unattended</text>

  <!-- Output: JSONL event stream -->
  <rect x="520" y="104" width="164" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="602" y="124" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">stdout · JSONL events</text>
  <text x="530" y="144" fill="#475569" font-size="9" font-family="monospace">thread.started</text>
  <text x="530" y="160" fill="#475569" font-size="9" font-family="monospace">item.completed · command</text>
  <text x="530" y="176" fill="#475569" font-size="9" font-family="monospace">item.completed · agent_msg</text>
  <text x="530" y="192" fill="#475569" font-size="9" font-family="monospace">turn.completed · usage</text>
  <text x="602" y="214" fill="#94a3b8" font-size="9" text-anchor="middle">stderr: human narration</text>

  <!-- Output: structured findings -->
  <rect x="520" y="250" width="164" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="602" y="272" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">Structured findings</text>
  <text x="602" y="292" fill="#059669" font-size="10" text-anchor="middle">overall_correctness</text>
  <text x="602" y="308" fill="#059669" font-size="10" text-anchor="middle">findings[]: title·file·line·sev</text>
  <text x="602" y="328" fill="#16a34a" font-size="9" text-anchor="middle">validated vs --output-schema</text>

  <!-- arrows: drivers -> loop -->
  <line x1="214" y1="121" x2="278" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="214" y1="203" x2="278" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="214" y1="285" x2="278" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- arrows: loop -> outputs -->
  <line x1="472" y1="170" x2="518" y2="162" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="472" y1="214" x2="518" y2="292" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- final agent_message is the JSON findings -->
  <path d="M 700 200 C 716 200 716 290 686 292" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="716" y="248" fill="#16a34a" font-size="9" text-anchor="middle" transform="rotate(90 716 248)">final agent_message = JSON</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The loop never changes — only who drives it and how the answer comes back.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s23 · Review, CI &amp; Cloud</text>
</svg>
