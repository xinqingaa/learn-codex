<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1280" height="780" fill="#ffffff"/>
<text x="640" y="36" fill="#111827" font-size="22" text-anchor="middle" font-weight="700">多执行者：四层边界不要画进同一个框</text>
<text x="640" y="60" fill="#6b7280" font-size="13" text-anchor="middle">共享的是信息、规则和地盘，不是窗口。产品能力与教程加强分开标注。</text>
<rect x="40" y="88" width="1200" height="120" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
<text x="64" y="124" fill="#111827" font-size="18" text-anchor="start" font-weight="700">1  注意力 / 窗口</text>
<rect x="64" y="140" width="96" height="24" rx="4" fill="#dcfce7" stroke="none" stroke-width="0"/>
<text x="112.0" y="157" fill="#166534" font-size="12" text-anchor="middle" font-weight="600">Codex 有</text>
<text x="64" y="188" fill="#374151" font-size="14" text-anchor="start">同一循环 + 新 input + 收窄工具。await 子循环只回结论；spawn 立刻返回，信箱传信息。</text>
<rect x="40" y="228" width="1200" height="120" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
<text x="64" y="264" fill="#111827" font-size="18" text-anchor="start" font-weight="700">2  通信 / 信箱</text>
<rect x="64" y="280" width="96" height="24" rx="4" fill="#dcfce7" stroke="none" stroke-width="0"/>
<text x="112.0" y="297" fill="#166534" font-size="12" text-anchor="middle" font-weight="600">Codex 有</text>
<text x="64" y="328" fill="#374151" font-size="14" text-anchor="start">进程内队列 + 唤醒。send 默认不新开一轮；终态由 harness 投给父。UI 事件不是这层。</text>
<rect x="40" y="368" width="1200" height="120" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
<text x="64" y="404" fill="#111827" font-size="18" text-anchor="start" font-weight="700">3  规则 / 拒绝权</text>
<rect x="64" y="420" width="108" height="24" rx="4" fill="#ffedd5" stroke="none" stroke-width="0"/>
<text x="118.0" y="437" fill="#9a3412" font-size="12" text-anchor="middle" font-weight="600">教程加强</text>
<text x="64" y="468" fill="#374151" font-size="14" text-anchor="start">依赖未完成则不许认领；并发派活才需要 replyTo 账本；工人自领必须原子 claim。</text>
<rect x="40" y="508" width="1200" height="120" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8"/>
<text x="64" y="544" fill="#111827" font-size="18" text-anchor="start" font-weight="700">4  地盘 / 目录</text>
<rect x="64" y="560" width="132" height="24" rx="4" fill="#ede9fe" stroke="none" stroke-width="0"/>
<text x="130.0" y="577" fill="#6b21a8" font-size="12" text-anchor="middle" font-weight="600">本机 worktree</text>
<text x="64" y="608" fill="#374151" font-size="14" text-anchor="start">session 启动时定 cwd，模型无创建工具。冲突推迟到交回。Cloud 容器是另一条隔离轴。</text>
<text x="640" y="660" fill="#6b7280" font-size="13" text-anchor="middle">能见度（计划清单）≠ 拒绝权（认领检查）。信箱传的是说出来的字，不是对方的上下文。</text>
<text x="640" y="684" fill="#6b7280" font-size="13" text-anchor="middle">worktree 共享 .git；sandbox 锁当前 cwd；Cloud 才是整台可丢弃环境。</text>
<text x="640" y="724" fill="#374151" font-size="13" text-anchor="middle" font-weight="600">验收：主线看不到支线中间过程；过境必须显式发送；并行写入 disjoint；冲突在交回时可见。</text>
</svg>
