<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1280" height="700" fill="#ffffff"/>
<text x="640" y="36" fill="#111827" font-size="22" text-anchor="middle" font-weight="700">注意力预算：四种挤占，四条路径</text>
<text x="640" y="60" fill="#6b7280" font-size="13" text-anchor="middle">不要用「更大的系统提示」同时解决计划、支线、规范和历史膨胀。</text>
<rect x="40" y="88" width="270" height="480" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
<text x="175" y="120" fill="#1e3a8f" font-size="18" text-anchor="middle" font-weight="700">常驻</text>
<text x="175" y="146" fill="#4b5563" font-size="12" text-anchor="middle">每轮都带，必须短</text>
<rect x="58" y="180" width="234" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="175" y="222" fill="#111827" font-size="13" text-anchor="middle">内置 base</text>
<rect x="58" y="268" width="234" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="175" y="310" fill="#111827" font-size="13" text-anchor="middle">AGENTS.md</text>
<rect x="58" y="356" width="234" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="175" y="398" fill="#111827" font-size="13" text-anchor="middle">技能目录 name+desc</text>
<rect x="58" y="444" width="234" height="72" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="175" y="486" fill="#111827" font-size="13" text-anchor="middle">config 不进 prompt</text>
<rect x="350" y="88" width="270" height="480" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
<text x="485" y="120" fill="#166534" font-size="18" text-anchor="middle" font-weight="700">按需</text>
<text x="485" y="146" fill="#4b5563" font-size="12" text-anchor="middle">用到才付 token</text>
<rect x="368" y="180" width="234" height="72" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="485" y="222" fill="#111827" font-size="13" text-anchor="middle">load_skill 正文</text>
<rect x="368" y="268" width="234" height="72" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="485" y="310" fill="#111827" font-size="13" text-anchor="middle">工具结果</text>
<rect x="368" y="356" width="234" height="72" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="485" y="398" fill="#111827" font-size="13" text-anchor="middle">MCP 返回</text>
<rect x="368" y="444" width="234" height="72" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="485" y="486" fill="#111827" font-size="13" text-anchor="middle">进历史，随对话携带</text>
<rect x="660" y="88" width="270" height="480" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
<text x="795" y="120" fill="#9a3412" font-size="18" text-anchor="middle" font-weight="700">有损压缩</text>
<text x="795" y="146" fill="#4b5563" font-size="12" text-anchor="middle">换窗口，提前压</text>
<rect x="678" y="180" width="234" height="72" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="795" y="222" fill="#111827" font-size="13" text-anchor="middle">切在最后一条 user 前</text>
<rect x="678" y="268" width="234" height="72" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="795" y="310" fill="#111827" font-size="13" text-anchor="middle">保住目标 / 文件 / 未完成</text>
<rect x="678" y="356" width="234" height="72" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="795" y="398" fill="#111827" font-size="13" text-anchor="middle">总结本身也要额度</text>
<rect x="678" y="444" width="234" height="72" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="795" y="486" fill="#111827" font-size="13" text-anchor="middle">爆了再压会发不出请求</text>
<rect x="970" y="88" width="270" height="480" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.8"/>
<text x="1105" y="120" fill="#6b21a8" font-size="18" text-anchor="middle" font-weight="700">持久化</text>
<text x="1105" y="146" fill="#4b5563" font-size="12" text-anchor="middle">不占窗口</text>
<rect x="988" y="180" width="234" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="1105" y="222" fill="#111827" font-size="13" text-anchor="middle">JSONL write-through</text>
<rect x="988" y="268" width="234" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="1105" y="310" fill="#111827" font-size="13" text-anchor="middle">resume = replay</text>
<rect x="988" y="356" width="234" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="1105" y="398" fill="#111827" font-size="13" text-anchor="middle">fork = 复制新 id</text>
<rect x="988" y="444" width="234" height="72" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="1105" y="486" fill="#111827" font-size="13" text-anchor="middle">精确，和摘要互补</text>
<text x="640" y="604" fill="#6b7280" font-size="13" text-anchor="middle">计划工具只换能见度：harness 看得见步骤，拦不住跳步。强制顺序是另一层拒绝权。</text>
<text x="640" y="628" fill="#6b7280" font-size="13" text-anchor="middle">子循环丢掉的是对话历史，不是文件系统副作用。主线只应看到一条结论。</text>
<text x="640" y="668" fill="#374151" font-size="13" text-anchor="middle" font-weight="600">常驻层保持短；贵的知识按需进历史；长会话在硬上限之前腾地方；磁盘上保留精确日志。</text>
</svg>
