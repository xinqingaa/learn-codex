<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="640" y="36" fill="#111827" font-size="22" text-anchor="middle" font-weight="700">三道接缝：机制挂在循环上，不改循环</text>
<text x="640" y="60" fill="#6b7280" font-size="13" text-anchor="middle">加能力先问属于哪一层。挂错层就会去改 for (;;) 或把策略写进提示词。</text>
<rect x="40" y="84" width="1200" height="560" rx="14" fill="#eff6ff" stroke="#1e40af" stroke-width="2.5"/>
<text x="60" y="112" fill="#1e3a8f" font-size="16" text-anchor="start" font-weight="700">Agent Loop（最外层运行时）</text>
<text x="60" y="134" fill="#3b82f6" font-size="13" text-anchor="start">结构信号：有 function_call 则派发，没有则收尾</text>
<rect x="64" y="152" width="1152" height="460" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="84" y="178" fill="#166534" font-size="15" text-anchor="start" font-weight="700">模型调用外套</text>
<rect x="84" y="192" width="320" height="56" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="244.0" y="214.0" fill="#14532d" font-size="14" text-anchor="middle" font-weight="600">compact</text>
<text x="244.0" y="234.0" fill="#6b7280" font-size="12" text-anchor="middle">超预算则摘要替换旧历史</text>
<rect x="430" y="192" width="320" height="56" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="590.0" y="214.0" fill="#14532d" font-size="14" text-anchor="middle" font-weight="600">recovery</text>
<text x="590.0" y="234.0" fill="#6b7280" font-size="12" text-anchor="middle">失败分类后再试或停</text>
<rect x="776" y="192" width="320" height="56" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<text x="936.0" y="214.0" fill="#14532d" font-size="14" text-anchor="middle" font-weight="600">rollout</text>
<text x="936.0" y="234.0" fill="#6b7280" font-size="12" text-anchor="middle">item 立刻追加进 JSONL</text>
<rect x="88" y="268" width="1104" height="316" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="108" y="294" fill="#9a3412" font-size="15" text-anchor="start" font-weight="700">dispatch 外套</text>
<rect x="108" y="308" width="500" height="56" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
<text x="358.0" y="330.0" fill="#111827" font-size="14" text-anchor="middle" font-weight="600">审批 approval_policy</text>
<text x="358.0" y="350.0" fill="#6b7280" font-size="12" text-anchor="middle">要不要问人 · 拒绝即错误 item</text>
<rect x="640" y="308" width="516" height="56" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="898.0" y="330.0" fill="#111827" font-size="14" text-anchor="middle" font-weight="600">沙箱 sandbox_mode</text>
<text x="898.0" y="350.0" fill="#6b7280" font-size="12" text-anchor="middle">碰得到什么 · 内核强制</text>
<rect x="112" y="384" width="1056" height="172" rx="12" fill="#111827" stroke="#111827" stroke-width="2"/>
<text x="132" y="412" fill="#93c5fd" font-size="15" text-anchor="start" font-weight="700">注册表内侧 · 按名字分发</text>
<rect x="132" y="432" width="188" height="44" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
<text x="226" y="460" fill="#e5e7eb" font-size="13" text-anchor="middle" font-weight="600">shell / patch</text>
<rect x="340" y="432" width="188" height="44" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
<text x="434" y="460" fill="#e5e7eb" font-size="13" text-anchor="middle" font-weight="600">update_plan</text>
<rect x="548" y="432" width="188" height="44" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
<text x="642" y="460" fill="#e5e7eb" font-size="13" text-anchor="middle" font-weight="600">load_skill</text>
<rect x="756" y="432" width="188" height="44" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
<text x="850" y="460" fill="#e5e7eb" font-size="13" text-anchor="middle" font-weight="600">spawn / task</text>
<rect x="964" y="432" width="188" height="44" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
<text x="1058" y="460" fill="#e5e7eb" font-size="13" text-anchor="middle" font-weight="600">mcp__*</text>
<text x="640" y="502" fill="#9ca3af" font-size="13" text-anchor="middle">查不到名字：返回错误字符串，不崩溃。循环这一行永远是 dispatch。</text>
<text x="640" y="668" fill="#6b7280" font-size="13" text-anchor="middle">一次落地：外套包住调用 → 循环看见结构信号 → 外套包住分发 → 注册表执行。</text>
</svg>
