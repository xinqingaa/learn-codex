<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Skills — load knowledge on demand, not all up front</text>

  <!-- skills/ dir (on disk) -->
  <rect x="55" y="72" width="210" height="108" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="92" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">skills/  (on disk)</text>
  <rect x="70" y="102" width="180" height="28" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="160" y="120" fill="#334155" font-size="11" text-anchor="middle">code-review/SKILL.md</text>
  <rect x="70" y="138" width="180" height="28" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="160" y="156" fill="#334155" font-size="11" text-anchor="middle">commit-message/SKILL.md</text>

  <!-- system instructions (catalog) -->
  <rect x="400" y="72" width="265" height="92" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="532" y="96" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">System instructions</text>
  <text x="532" y="116" fill="#b45309" font-size="11" text-anchor="middle">catalog: name + description only</text>
  <text x="532" y="134" fill="#b45309" font-size="11" text-anchor="middle">Level 1 · cheap · always present</text>

  <!-- Model -->
  <rect x="290" y="212" width="220" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="400" y="238" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="400" y="258" fill="#93c5fd" font-size="11" text-anchor="middle">sees the catalog, picks a skill</text>

  <!-- load_skill handler -->
  <rect x="290" y="352" width="220" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="376" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">load_skill handler</text>
  <text x="400" y="396" fill="#059669" font-size="11" text-anchor="middle">registry lookup → full SKILL.md</text>

  <!-- skills -> instructions : startup scan -->
  <line x1="265" y1="118" x2="396" y2="118" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="330" y="104" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">① startup scan: name + description</text>

  <!-- instructions -> model : catalog in context -->
  <line x1="500" y1="164" x2="462" y2="208" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="516" y="192" fill="#555" font-size="10" font-weight="600">catalog (cheap, always)</text>

  <!-- model -> handler : load_skill call -->
  <line x1="355" y1="282" x2="355" y2="348" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="343" y="318" fill="#2563eb" font-size="11" font-weight="600" text-anchor="end">② load_skill(name)</text>

  <!-- handler -> model : full body as tool result -->
  <line x1="445" y1="352" x2="445" y2="286" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="457" y="318" fill="#16a34a" font-size="11" font-weight="600">full SKILL.md (tool result)</text>

  <!-- skills -> handler : full body source -->
  <path d="M 150 180 L 150 385 L 286 385" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="158" y="300" fill="#64748b" font-size="10" font-weight="600">full body</text>
  <text x="158" y="314" fill="#64748b" font-size="10" font-weight="600">(from registry)</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The catalog is cheap and always present; the full SKILL.md is expensive and loads only on demand.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">Real Codex scans ~/.codex/skills (user) and .agents/skills (project).   s07 · Skills</text>
</svg>
