<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The CLI Surface — many doors, one loop</text>

  <!-- argv subcommands (left column) -->
  <text x="150" y="80" fill="#0e7490" font-size="12" font-weight="700" text-anchor="middle">argv subcommands</text>
  <g font-size="11">
    <rect x="60" y="92" width="180" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="150" y="111" fill="#155e75" text-anchor="middle">codex  (TUI, default)</text>
    <rect x="60" y="128" width="180" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="150" y="147" fill="#155e75" text-anchor="middle">codex exec "…"  (headless)</text>
    <rect x="60" y="164" width="180" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="150" y="183" fill="#155e75" text-anchor="middle">codex resume --last</text>
    <rect x="60" y="200" width="180" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="150" y="219" fill="#155e75" text-anchor="middle">codex review</text>
    <rect x="60" y="236" width="180" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="150" y="255" fill="#155e75" text-anchor="middle">codex login / mcp</text>
  </g>

  <!-- slash commands (right column) -->
  <text x="570" y="80" fill="#0e7490" font-size="12" font-weight="700" text-anchor="middle">in-session slash commands</text>
  <g font-size="11">
    <rect x="480" y="92" width="180" height="30" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="111" fill="#075985" text-anchor="middle">/model  /approvals</text>
    <rect x="480" y="128" width="180" height="30" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="147" fill="#075985" text-anchor="middle">/compact  /status</text>
    <rect x="480" y="164" width="180" height="30" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="183" fill="#075985" text-anchor="middle">/diff  /init</text>
    <rect x="480" y="200" width="180" height="30" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="219" fill="#075985" text-anchor="middle">/new  /mcp  /help</text>
    <rect x="480" y="236" width="180" height="30" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="255" fill="#075985" text-anchor="middle">~/.codex/prompts/*.md</text>
  </g>

  <!-- dispatch layer -->
  <rect x="280" y="150" width="160" height="86" rx="10" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="182" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">DISPATCH</text>
  <text x="360" y="202" fill="#67e8f9" font-size="11" text-anchor="middle">parse → route → mutate</text>
  <text x="360" y="218" fill="#67e8f9" font-size="11" text-anchor="middle">state / trigger action</text>

  <!-- arrows: subcommands -> dispatch, slash -> dispatch -->
  <line x1="240" y1="180" x2="278" y2="186" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="480" y1="180" x2="442" y2="186" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- shared session -->
  <rect x="270" y="292" width="180" height="52" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="314" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">shared Session</text>
  <text x="360" y="332" fill="#b45309" font-size="10.5" text-anchor="middle">model · effort · approval · thread</text>

  <!-- the one loop -->
  <rect x="270" y="404" width="180" height="64" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="430" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ONE agent loop</text>
  <text x="360" y="450" fill="#93c5fd" font-size="11" text-anchor="middle">call model → run tool → feed back</text>

  <!-- arrows dispatch->session->loop -->
  <line x1="360" y1="236" x2="360" y2="288" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="344" x2="360" y2="400" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- footer -->
  <rect x="60" y="486" width="600" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="504" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Commands only change state or trigger actions — the loop itself never changes.</text>
  <text x="360" y="521" fill="#64748b" font-size="11" text-anchor="middle">s21 · The Codex CLI Surface</text>
</svg>
