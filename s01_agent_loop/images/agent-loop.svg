<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The Agent Loop — the harness turns model output into action</text>

  <!-- User -->
  <rect x="60" y="84" width="180" height="52" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="106" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">User Task</text>
  <text x="150" y="124" fill="#64748b" font-size="11" text-anchor="middle">"list my files &amp; run it"</text>

  <!-- Model (Responses API) -->
  <rect x="300" y="76" width="200" height="68" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="400" y="102" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="400" y="122" fill="#93c5fd" font-size="11" text-anchor="middle">reasoning · message · function_call</text>

  <!-- decision diamond -->
  <polygon points="400,176 470,216 400,256 330,216" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="212" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">function_call</text>
  <text x="400" y="228" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">this turn?</text>

  <!-- Shell tool -->
  <rect x="540" y="186" width="150" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="210" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">shell tool</text>
  <text x="615" y="228" fill="#059669" font-size="11" text-anchor="middle">runShell(command)</text>

  <!-- Final answer -->
  <rect x="90" y="300" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="200" y="324" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">Final Answer</text>
  <text x="200" y="342" fill="#059669" font-size="11" text-anchor="middle">print message, exit loop</text>

  <!-- arrows: user -> model -->
  <line x1="240" y1="110" x2="298" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- model -> decision -->
  <line x1="400" y1="144" x2="400" y2="172" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- decision -> tool (yes) -->
  <line x1="470" y1="216" x2="538" y2="216" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="504" y="206" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">yes</text>
  <!-- tool -> back to model (function_call_output) -->
  <path d="M 615 246 C 615 470 400 470 400 150" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)" transform="translate(0,-6)"/>
  <text x="560" y="420" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">function_call_output fed back — loop continues</text>
  <!-- decision -> final (no) -->
  <path d="M 330 216 L 210 216 L 210 296" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="206" fill="#555" font-size="11" font-weight="600" text-anchor="middle">no</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The model decides; the harness executes. 30 lines of loop — the rest of the course layers on top.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s01 · Agent Loop</text>
</svg>
