<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">approval_policy — a gate before every tool executes</text>

  <!-- function_call -->
  <rect x="40" y="86" width="160" height="56" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="120" y="108" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">function_call</text>
  <text x="120" y="126" fill="#93c5fd" font-size="11" text-anchor="middle">name + arguments</text>

  <!-- classify -->
  <rect x="252" y="86" width="170" height="56" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="337" y="108" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">classify(call)</text>
  <text x="337" y="126" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">read · write · danger</text>

  <!-- policy gate -->
  <polygon points="560,74 660,114 560,154 460,114" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="110" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">approval</text>
  <text x="560" y="126" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">policy</text>

  <!-- arrows: call -> classify -> gate -->
  <line x1="200" y1="114" x2="250" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="422" y1="114" x2="458" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- four modes table -->
  <rect x="60" y="188" width="600" height="118" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="210" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">the four modes — when do we stop and ask a human?</text>
  <text x="90" y="238" fill="#065f46" font-size="12" font-weight="600">never</text>
  <text x="220" y="238" fill="#334155" font-size="12">run everything, ask nothing</text>
  <text x="90" y="262" fill="#065f46" font-size="12" font-weight="600">on-failure</text>
  <text x="220" y="262" fill="#334155" font-size="12">run; ask only when a call fails (escalate?)</text>
  <text x="90" y="286" fill="#065f46" font-size="12" font-weight="600">on-request</text>
  <text x="220" y="286" fill="#334155" font-size="12">hold only danger-class calls for a y/n</text>

  <!-- outcomes -->
  <rect x="90" y="352" width="240" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="210" y="376" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">allow → dispatch tool</text>
  <text x="210" y="394" fill="#059669" font-size="11" text-anchor="middle">result fed back, loop continues</text>

  <rect x="390" y="352" width="240" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="376" fill="#7f1d1d" font-size="13" font-weight="600" text-anchor="middle">deny → error item</text>
  <text x="510" y="394" fill="#dc2626" font-size="11" text-anchor="middle">model sees the refusal, replans</text>

  <!-- gate -> outcomes -->
  <path d="M 500 150 C 420 220 260 300 212 350" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="330" y="260" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">allow</text>
  <path d="M 620 150 C 660 230 590 300 545 350" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="650" y="260" fill="#dc2626" font-size="11" font-weight="600" text-anchor="middle">deny</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The model proposes; the policy disposes. A denied call is data, not a crash.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s03 · Approval</text>
</svg>
