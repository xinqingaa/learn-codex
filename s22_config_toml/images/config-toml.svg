<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">config.toml in Depth — every knob, one resolver</text>

  <!-- LEFT: the config.toml file (the knobs) -->
  <rect x="24" y="88" width="168" height="252" rx="8" fill="#111827"/>
  <text x="108" y="112" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">config.toml</text>
  <g fill="#93c5fd" font-size="10.5">
    <text x="40" y="140">model · effort</text>
    <text x="40" y="162">model_provider</text>
    <text x="40" y="184">model_providers</text>
    <text x="40" y="206">approval_policy</text>
    <text x="40" y="228">sandbox_mode</text>
    <text x="40" y="250">sandbox_workspace_write</text>
    <text x="40" y="272">profiles</text>
    <text x="40" y="294">mcp_servers</text>
    <text x="40" y="316">tui · history · projects</text>
  </g>

  <!-- parse arrow: file -> chain -->
  <line x1="192" y1="214" x2="220" y2="214" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="206" y="204" fill="#64748b" font-size="9.5" text-anchor="middle">parse</text>

  <!-- MIDDLE: the precedence chain (highest on top) -->
  <!-- vertical precedence arrow -->
  <line x1="212" y1="276" x2="212" y2="100" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-up)"/>

  <rect x="224" y="92" width="158" height="40" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="303" y="109" fill="#7f1d1d" font-size="12" font-weight="700" text-anchor="middle">CLI</text>
  <text x="303" y="125" fill="#b91c1c" font-size="9.5" text-anchor="middle">-c key=value · --model</text>

  <rect x="224" y="140" width="158" height="40" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="303" y="157" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">--profile</text>
  <text x="303" y="173" fill="#b45309" font-size="9.5" text-anchor="middle">named preset</text>

  <rect x="224" y="188" width="158" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="303" y="205" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">config.toml</text>
  <text x="303" y="221" fill="#2563eb" font-size="9.5" text-anchor="middle">root keys</text>

  <rect x="224" y="236" width="158" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="303" y="253" fill="#334155" font-size="12" font-weight="700" text-anchor="middle">built-in</text>
  <text x="303" y="269" fill="#64748b" font-size="9.5" text-anchor="middle">defaults</text>

  <!-- resolveConfig node -->
  <rect x="404" y="150" width="96" height="64" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="452" y="176" fill="#111827" font-size="12" font-weight="700" text-anchor="middle">resolve</text>
  <text x="452" y="194" fill="#334155" font-size="9.5" text-anchor="middle">last layer wins</text>

  <line x1="382" y1="182" x2="402" y2="182" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RIGHT: effective config -->
  <rect x="524" y="88" width="172" height="118" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="110" fill="#065f46" font-size="12.5" font-weight="700" text-anchor="middle">effective config</text>
  <g fill="#065f46" font-size="10.5">
    <text x="540" y="134">model · effort</text>
    <text x="540" y="154">approval_policy</text>
    <text x="540" y="174">sandbox_mode</text>
    <text x="540" y="194">model_provider</text>
  </g>
  <line x1="500" y1="160" x2="522" y2="150" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- RIGHT: provider lookup -->
  <rect x="524" y="230" width="172" height="86" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="610" y="252" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">provider lookup</text>
  <g fill="#2563eb" font-size="10">
    <text x="540" y="274">model_providers[id]</text>
    <text x="540" y="292">base_url · env_key</text>
    <text x="540" y="308">wire_api = responses</text>
  </g>
  <line x1="610" y1="206" x2="610" y2="228" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- precedence strip -->
  <rect x="24" y="352" width="672" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="374" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Precedence (high → low):  CLI -c / flags  &gt;  --profile  &gt;  config.toml root  &gt;  built-in default</text>

  <!-- footer note -->
  <rect x="60" y="404" width="600" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="432" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">One file holds every knob; one resolver walks the chain and the last</text>
  <text x="360" y="452" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">layer to define a key wins. Swap a --profile or add -c and the same</text>
  <text x="360" y="470" fill="#64748b" font-size="11" text-anchor="middle">file resolves differently.   ·   s22 config.toml in Depth</text>
</svg>
