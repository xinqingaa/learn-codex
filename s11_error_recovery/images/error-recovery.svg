<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Classified Retry — the error kind picks the recovery path</text>

  <!-- Model call -->
  <rect x="60" y="84" width="170" height="56" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="145" y="106" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">callModel()</text>
  <text x="145" y="124" fill="#93c5fd" font-size="11" text-anchor="middle">throws an error</text>

  <!-- Classifier diamond -->
  <polygon points="400,80 478,124 400,168 322,124" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="120" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">classify</text>
  <text x="400" y="136" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">Error()</text>

  <line x1="230" y1="112" x2="320" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch 1: rate limit -->
  <rect x="60" y="216" width="270" height="58" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="195" y="238" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">rate_limit · 429 / 529</text>
  <text x="195" y="256" fill="#b45309" font-size="11" text-anchor="middle">backoff + jitter, retry up to N</text>

  <!-- Branch 2: context overflow -->
  <rect x="390" y="216" width="270" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="525" y="238" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">context_overflow · 413</text>
  <text x="525" y="256" fill="#2563eb" font-size="11" text-anchor="middle">reactive compact, retry once</text>

  <!-- Branch 3: abort -->
  <rect x="60" y="316" width="270" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="338" fill="#7f1d1d" font-size="13" font-weight="600" text-anchor="middle">abort · user Esc</text>
  <text x="195" y="356" fill="#dc2626" font-size="11" text-anchor="middle">stop the turn, no retry</text>

  <!-- Branch 4: unknown -->
  <rect x="390" y="316" width="270" height="58" rx="8" fill="#f4f4f5" stroke="#52525b" stroke-width="2"/>
  <text x="525" y="338" fill="#27272a" font-size="13" font-weight="600" text-anchor="middle">unknown</text>
  <text x="525" y="356" fill="#52525b" font-size="11" text-anchor="middle">retry a couple, then give up</text>

  <!-- classifier to branches -->
  <path d="M 360 158 L 200 212" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M 440 158 L 522 212" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 356 162 L 210 312" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 444 162 L 512 312" fill="none" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- retry loop back arrow (rate_limit + overflow retry) -->
  <path d="M 195 274 C 120 460 60 200 78 148" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M 525 274 C 640 470 690 200 485 110" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="360" y="452" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">recovered → continue → retry the model call</text>

  <!-- give up / stop sink -->
  <rect x="270" y="392" width="180" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="416" fill="#7f1d1d" font-size="12" font-weight="600" text-anchor="middle">give up / stop turn</text>
  <line x1="195" y1="374" x2="290" y2="398" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="525" y1="374" x2="432" y2="398" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The loop never changes — only the model call is wrapped. classifyError() decides the path.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s11 · Error Recovery</text>
</svg>
