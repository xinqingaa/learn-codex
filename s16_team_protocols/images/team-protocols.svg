<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Coordination Contracts — every message is a typed envelope</text>

  <!-- Lead -->
  <rect x="48" y="210" width="200" height="120" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="148" y="236" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">LEAD</text>
  <text x="148" y="256" fill="#93c5fd" font-size="11" text-anchor="middle">routes work · collects results</text>
  <rect x="66" y="270" width="164" height="44" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="148" y="288" fill="#d1d5db" font-size="11" text-anchor="middle">pending ledger</text>
  <text x="148" y="304" fill="#9ca3af" font-size="10" text-anchor="middle">req_002 → fulfilled</text>

  <!-- Envelope schema (top) -->
  <rect x="300" y="80" width="372" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="486" y="102" fill="#5b21b6" font-size="12" font-weight="600" text-anchor="middle">Envelope</text>
  <text x="486" y="122" fill="#7c3aed" font-size="11" text-anchor="middle">{ id, from, to, kind, payload, replyTo? }</text>
  <text x="486" y="140" fill="#7c3aed" font-size="11" text-anchor="middle">kind = request | response | broadcast</text>

  <!-- Teammate alice -->
  <rect x="472" y="200" width="200" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="572" y="226" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">alice</text>
  <text x="572" y="246" fill="#93c5fd" font-size="11" text-anchor="middle">runs the request, replies</text>

  <!-- Teammate bob -->
  <rect x="472" y="330" width="200" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="572" y="356" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">bob</text>
  <text x="572" y="376" fill="#93c5fd" font-size="11" text-anchor="middle">runs the request, replies</text>

  <!-- request: lead -> alice -->
  <line x1="248" y1="240" x2="468" y2="222" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="356" y="216" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">request {id:req_002}</text>

  <!-- response: alice -> lead -->
  <line x1="468" y1="252" x2="248" y2="272" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="356" y="296" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">response {replyTo:req_002}</text>

  <!-- request: lead -> bob -->
  <line x1="248" y1="300" x2="468" y2="352" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="336" y="346" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">request {id:req_003}</text>

  <!-- response: bob -> lead -->
  <line x1="468" y1="382" x2="248" y2="320" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="352" y="392" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">response {replyTo:req_003}</text>

  <!-- broadcast fan-out -->
  <path d="M 320 150 C 200 170 180 180 152 206" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 486 150 C 500 170 540 180 566 196" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="176" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">broadcast → everyone, no reply</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">One id threads the whole exchange: a request carries it out, its response carries it back.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s16 · Team Protocols</text>
</svg>
