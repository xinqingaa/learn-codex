<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Typed envelopes — correlate N requests by replyTo</text>

  <!-- Envelope: x=80..640 y=60..112 -->
  <rect x="80" y="60" width="560" height="52" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="82" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">Envelope</text>
  <text x="360" y="100" fill="#7c3aed" font-size="11" text-anchor="middle">{ id, from, to, kind, payload, replyTo?, triggerTurn }</text>

  <!-- root: x=250..470 y=128..204 -->
  <rect x="250" y="128" width="220" height="76" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="154" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">root</text>
  <text x="360" y="174" fill="#93c5fd" font-size="11" text-anchor="middle">pending ledger · collect by replyTo</text>
  <text x="360" y="192" fill="#93c5fd" font-size="11" text-anchor="middle">request · broadcast · match</text>

  <!-- alice: x=40..240 y=268..348  cx=140 -->
  <rect x="40" y="268" width="200" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="140" y="296" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">alice</text>
  <text x="140" y="316" fill="#93c5fd" font-size="11" text-anchor="middle">dispatch by kind</text>
  <text x="140" y="334" fill="#93c5fd" font-size="11" text-anchor="middle">two requests this demo</text>

  <!-- bob: x=480..680 y=268..348  cx=580 -->
  <rect x="480" y="268" width="200" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="580" y="296" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">bob</text>
  <text x="580" y="316" fill="#93c5fd" font-size="11" text-anchor="middle">dispatch by kind</text>
  <text x="580" y="334" fill="#93c5fd" font-size="11" text-anchor="middle">one request this demo</text>

  <!-- mailbox between children: x=268..452 y=276..340 -->
  <rect x="268" y="276" width="184" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="302" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">Mailbox</text>
  <text x="360" y="322" fill="#7c3aed" font-size="11" text-anchor="middle">in-process waiters</text>

  <!-- ledger under mailbox: x=180..540 y=392..456 -->
  <rect x="180" y="392" width="360" height="64" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="412" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">pending ledger</text>
  <text x="360" y="430" fill="#059669" font-size="11" text-anchor="middle">req_002 alice · req_003 bob · req_004 alice</text>
  <text x="360" y="446" fill="#059669" font-size="10" text-anchor="middle">req_999 unknown → ignored</text>

  <!-- request: two ports on root BOTTOM, then out to each child top -->
  <path d="M 290 204 L 290 236 L 140 236 L 140 268" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="148" y="228" fill="#7c3aed" font-size="11" font-weight="600">request</text>
  <path d="M 430 204 L 430 236 L 580 236 L 580 268" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="588" y="228" fill="#7c3aed" font-size="11" font-weight="600">request</text>

  <!-- response into mailbox left/right, then collect up the center rail -->
  <path d="M 240 308 L 268 308" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="254" y="360" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">replyTo</text>
  <path d="M 480 308 L 452 308" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="466" y="360" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">replyTo</text>
  <path d="M 360 276 L 360 204" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="372" y="248" fill="#16a34a" font-size="11" font-weight="600">response</text>

  <!-- broadcast: outer rails from root LEFT/RIGHT into child LEFT/RIGHT -->
  <path d="M 250 166 L 20 166 L 20 308 L 40 308" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="32" y="200" fill="#2563eb" font-size="11" font-weight="600">broadcast</text>
  <path d="M 470 166 L 700 166 L 700 308 L 680 308" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="688" y="200" fill="#2563eb" font-size="11" font-weight="600" text-anchor="end">broadcast</text>

  <rect x="60" y="468" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="490" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Codex stamps NEW_TASK / MESSAGE / FINAL_ANSWER; the chapter adds replyTo to match N in-flight requests.</text>
  <text x="360" y="508" fill="#64748b" font-size="11" text-anchor="middle">s16 · Team Protocols  ·  teaching ledger on s15 Mailbox</text>
</svg>
