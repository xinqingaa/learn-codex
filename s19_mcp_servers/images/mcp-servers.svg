<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">MCP Tool Bridge — spawn from config, before the loop</text>

  <!-- config: x=136..336 y=64..136  right=336 cy=100 -->
  <rect x="136" y="64" width="200" height="72" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="236" y="90" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">config.toml</text>
  <text x="236" y="108" fill="#334155" font-size="10" text-anchor="middle">[mcp_servers.docs]</text>
  <text x="236" y="122" fill="#334155" font-size="10" text-anchor="middle">[mcp_servers.deploy]</text>

  <!-- bridge: x=384..584 y=64..136  left=384 cx=484 bottom=136 -->
  <rect x="384" y="64" width="200" height="72" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="484" y="90" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">MCP client bridge</text>
  <text x="484" y="108" fill="#93c5fd" font-size="11" text-anchor="middle">session start</text>
  <text x="484" y="122" fill="#93c5fd" font-size="10" text-anchor="middle">not a model tool</text>

  <!-- spawn: config RIGHT → bridge LEFT -->
  <path d="M 336 100 L 384 100" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="92" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">spawn</text>

  <!-- docs: x=40..280 y=196..264  cx=160 top=196 bottom=264 -->
  <rect x="40" y="196" width="240" height="68" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="222" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">server: docs</text>
  <text x="160" y="242" fill="#059669" font-size="11" text-anchor="middle">search · get_page</text>

  <!-- deploy: x=440..680 y=196..264  cx=560 -->
  <rect x="440" y="196" width="240" height="68" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="222" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">server: deploy</text>
  <text x="560" y="242" fill="#059669" font-size="11" text-anchor="middle">trigger</text>

  <!-- stdio: bridge BOTTOM ports → y=168 rail → server TOPs -->
  <path d="M 434 136 L 434 168 L 160 168 L 160 196" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 534 136 L 534 168 L 560 168 L 560 196" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="160" fill="#555" font-size="10" font-weight="600" text-anchor="middle">stdio JSON-RPC</text>

  <!-- tools: x=80..640 y=320..372  top=320 bottom=372 cx=360 -->
  <rect x="80" y="320" width="560" height="52" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="340" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">exposed to the model as function tools</text>
  <text x="360" y="358" fill="#2563eb" font-size="11" text-anchor="middle">mcp__docs__search · mcp__docs__get_page · mcp__deploy__trigger</text>

  <!-- bridge names: server BOTTOM → y=292 rail → tools TOP at 240 / 480 -->
  <path d="M 160 264 L 160 292 L 240 292 L 240 320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 560 264 L 560 292 L 480 292 L 480 320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="284" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">mcp__* for the model</text>

  <!-- model: x=256..464 y=396..444  top=396 -->
  <rect x="256" y="396" width="208" height="48" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="416" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="360" y="432" fill="#93c5fd" font-size="10" text-anchor="middle">calls them like any other tool</text>

  <path d="M 360 372 L 360 396" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="48" y="464" width="624" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="488" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Codex starts MCP from config before the loop. The model has no connect_mcp tool.</text>
  <text x="360" y="508" fill="#64748b" font-size="11" text-anchor="middle">s19 · MCP Servers  ·  stdio client  ·  Codex-as-server is s24 / s27</text>
</svg>
