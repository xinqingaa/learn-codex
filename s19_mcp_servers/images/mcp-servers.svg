<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The MCP Tool Bridge — external tools over stdio JSON-RPC</text>

  <!-- config.toml -->
  <rect x="42" y="92" width="188" height="100" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="136" y="114" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">config.toml</text>
  <text x="136" y="134" fill="#334155" font-size="10" text-anchor="middle">[mcp_servers.docs]</text>
  <text x="136" y="149" fill="#334155" font-size="10" text-anchor="middle">[mcp_servers.deploy]</text>
  <text x="136" y="168" fill="#64748b" font-size="10" text-anchor="middle">command + args each</text>

  <!-- client bridge -->
  <rect x="300" y="96" width="180" height="92" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="390" y="122" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">MCP client bridge</text>
  <text x="390" y="142" fill="#93c5fd" font-size="11" text-anchor="middle">spawn · initialize</text>
  <text x="390" y="158" fill="#93c5fd" font-size="11" text-anchor="middle">tools/list · tools/call</text>

  <!-- server: docs -->
  <rect x="540" y="66" width="150" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="90" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">server: docs</text>
  <text x="615" y="108" fill="#059669" font-size="10" text-anchor="middle">search · get_page</text>

  <!-- server: deploy -->
  <rect x="540" y="158" width="150" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="615" y="182" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">server: deploy</text>
  <text x="615" y="200" fill="#059669" font-size="10" text-anchor="middle">trigger</text>

  <!-- arrows: config -> bridge (declare+spawn), bridge <-> servers (stdio JSON-RPC) -->
  <line x1="230" y1="142" x2="298" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="264" y="132" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">spawn</text>
  <line x1="480" y1="112" x2="538" y2="100" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="538" y1="112" x2="480" y2="124" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="509" y="92" fill="#555" font-size="9" text-anchor="middle">stdio JSON-RPC</text>
  <line x1="480" y1="168" x2="538" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="538" y1="168" x2="480" y2="156" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="509" y="206" fill="#555" font-size="9" text-anchor="middle">child processes</text>

  <!-- bridged function tools -->
  <rect x="150" y="300" width="420" height="58" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="324" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">exposed to the model as function tools</text>
  <text x="360" y="344" fill="#2563eb" font-size="11" text-anchor="middle">mcp__docs__search · mcp__docs__get_page · mcp__deploy__trigger</text>

  <!-- model -->
  <rect x="270" y="412" width="180" height="58" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="436" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="360" y="454" fill="#93c5fd" font-size="10" text-anchor="middle">calls them like any other tool</text>

  <line x1="390" y1="188" x2="360" y2="298" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="402" y="248" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">bridge into the tool registry</text>
  <line x1="360" y1="358" x2="360" y2="410" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- footer note -->
  <rect x="60" y="478" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="500" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Discover, namespace as mcp__server__tool, call — the agent never knows the tool is a separate process.</text>
  <text x="360" y="518" fill="#64748b" font-size="11" text-anchor="middle">s19 · MCP Servers</text>
</svg>
