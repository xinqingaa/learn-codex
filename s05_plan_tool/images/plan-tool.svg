<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The Plan Tool — update_plan keeps a live checklist the harness can see</text>

  <!-- Model -->
  <rect x="270" y="72" width="180" height="64" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="98" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="360" y="118" fill="#93c5fd" font-size="11" text-anchor="middle">emits update_plan + shell</text>

  <!-- update_plan handler -->
  <rect x="70" y="192" width="220" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="216" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">update_plan handler</text>
  <text x="180" y="234" fill="#64748b" font-size="11" text-anchor="middle">stores currentPlan[] in harness</text>
  <text x="180" y="250" fill="#64748b" font-size="11" text-anchor="middle">(no real work — just the plan)</text>

  <!-- shell tool -->
  <rect x="440" y="192" width="200" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="216" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">shell tool</text>
  <text x="540" y="234" fill="#059669" font-size="11" text-anchor="middle">runs each step for real</text>

  <!-- arrows: model -> update_plan -->
  <line x1="320" y1="136" x2="200" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="225" y="152" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">update_plan(plan)</text>
  <!-- arrows: model -> shell -->
  <line x1="410" y1="136" x2="520" y2="188" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="500" y="152" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">shell(step)</text>
  <!-- shell output back to model -->
  <path d="M 540 192 C 540 160 470 150 452 130" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="588" y="160" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">output fed back</text>

  <!-- live checklist panel -->
  <rect x="70" y="300" width="580" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="92" y="328" fill="#111827" font-size="13" font-weight="700">Live checklist — re-rendered on every update_plan call</text>

  <text x="100" y="362" fill="#16a34a" font-size="15" font-weight="700">✓</text>
  <text x="126" y="362" fill="#334155" font-size="13">Inspect the workspace</text>
  <text x="640" y="362" fill="#16a34a" font-size="11" font-weight="600" text-anchor="end">completed</text>

  <text x="100" y="392" fill="#0891b2" font-size="15" font-weight="700">▸</text>
  <text x="126" y="392" fill="#334155" font-size="13">Create hello.ts that prints a greeting</text>
  <text x="640" y="392" fill="#0891b2" font-size="11" font-weight="600" text-anchor="end">in_progress</text>

  <text x="100" y="422" fill="#94a3b8" font-size="15" font-weight="700">○</text>
  <text x="126" y="422" fill="#334155" font-size="13">Run it to verify the output</text>
  <text x="640" y="422" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="end">pending</text>

  <!-- plan handler -> checklist -->
  <line x1="180" y1="262" x2="180" y2="296" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="196" y="284" fill="#2563eb" font-size="11" font-weight="600">render</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The plan lives in the harness, not the model's head — so a long task can't lose steps to attention drift.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s05 · Plan Tool</text>
</svg>
