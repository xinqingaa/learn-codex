<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">unified_exec — yield window, then harvest</text>

  <!-- Main loop -->
  <rect x="40" y="72" width="640" height="148" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="94" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">Agent loop · model sees tool results only</text>

  <rect x="56" y="112" width="120" height="46" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="116" y="132" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Model</text>
  <text x="116" y="148" fill="#93c5fd" font-size="10" text-anchor="middle">keeps reasoning</text>

  <rect x="196" y="112" width="200" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="296" y="132" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">exec_command</text>
  <text x="296" y="148" fill="#2563eb" font-size="10" text-anchor="middle">wait yield → session_id</text>

  <rect x="416" y="112" width="244" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="538" y="132" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">shell (fast work)</text>
  <text x="538" y="148" fill="#059669" font-size="10" text-anchor="middle">read config · lint · ...</text>

  <line x1="176" y1="135" x2="194" y2="135" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="396" y1="135" x2="414" y2="135" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="80" y1="196" x2="640" y2="196" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="360" y="188" fill="#64748b" font-size="10" text-anchor="middle">turns pass — the loop is filled with other work, not idle waiting</text>

  <!-- Child process + session table -->
  <rect x="56" y="248" width="268" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="190" y="274" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">child_process.spawn</text>
  <text x="190" y="294" fill="#93c5fd" font-size="11" text-anchor="middle">keeps running after yield</text>

  <rect x="348" y="248" width="156" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="426" y="274" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">session table</text>
  <text x="426" y="292" fill="#2563eb" font-size="10" text-anchor="middle">session_id → running</text>
  <text x="426" y="306" fill="#2563eb" font-size="10" text-anchor="middle">+ output snapshot</text>

  <rect x="524" y="248" width="156" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="602" y="274" fill="#5b21b6" font-size="12" font-weight="600" text-anchor="middle">Client EventMsg</text>
  <text x="602" y="292" fill="#7c3aed" font-size="10" text-anchor="middle">Begin / End → TUI</text>
  <text x="602" y="306" fill="#7c3aed" font-size="10" text-anchor="middle">not the model</text>

  <path d="M 296 158 L 190 246" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="324" y1="283" x2="346" y2="283" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="504" y1="283" x2="522" y2="283" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- write_stdin harvest -->
  <rect x="196" y="348" width="268" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="370" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">write_stdin(session_id, chars: "")</text>
  <text x="330" y="388" fill="#059669" font-size="11" text-anchor="middle">another yield window → harvest output</text>

  <path d="M 426 318 C 426 348 480 348 464 376" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 330 404 C 330 440 140 448 116 162" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="210" y="430" fill="#16a34a" font-size="11" font-weight="600">tool result on a later turn</text>

  <!-- footer -->
  <rect x="40" y="456" width="640" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="480" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Yield = max wait per tool call. Handle = still running. Harvest = write_stdin later.</text>
  <text x="360" y="500" fill="#64748b" font-size="11" text-anchor="middle">Client EventMsg feeds the TUI. Idle exit does not auto-wake the model.</text>
</svg>
