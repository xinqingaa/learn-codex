<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Background Tasks — start now, harvest later</text>

  <!-- Main loop timeline (top) -->
  <rect x="60" y="80" width="600" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="102" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">Agent main loop (never blocks)</text>

  <!-- model box -->
  <rect x="80" y="120" width="130" height="46" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="145" y="140" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Model</text>
  <text x="145" y="156" fill="#93c5fd" font-size="10" text-anchor="middle">keeps reasoning</text>

  <!-- run_background -->
  <rect x="240" y="120" width="180" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="140" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">run_background</text>
  <text x="330" y="156" fill="#2563eb" font-size="10" text-anchor="middle">returns bg_1 instantly</text>

  <!-- fast foreground work -->
  <rect x="450" y="120" width="190" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="545" y="140" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">shell (fast work)</text>
  <text x="545" y="156" fill="#059669" font-size="10" text-anchor="middle">read config · lint · ...</text>

  <line x1="210" y1="143" x2="238" y2="143" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="143" x2="448" y2="143" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- time arrow along the loop -->
  <line x1="100" y1="196" x2="640" y2="196" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="370" y="190" fill="#64748b" font-size="10" text-anchor="middle">turns pass — the loop is filled with other work, not idle waiting</text>

  <!-- spawn / child process (bottom) -->
  <rect x="240" y="272" width="240" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="298" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">child_process.spawn</text>
  <text x="360" y="318" fill="#93c5fd" font-size="11" text-anchor="middle">runs in background · non-blocking</text>

  <!-- registry -->
  <rect x="520" y="272" width="140" height="70" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="298" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">bg registry</text>
  <text x="590" y="316" fill="#2563eb" font-size="10" text-anchor="middle">bg_1 → running/done</text>
  <text x="590" y="330" fill="#2563eb" font-size="10" text-anchor="middle">+ captured output</text>

  <!-- spawn arrow down from run_background -->
  <path d="M 330 166 L 340 268" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <!-- spawn to registry -->
  <line x1="480" y1="307" x2="518" y2="307" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- check_background harvest -->
  <rect x="240" y="392" width="240" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="414" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">check_background(bg_1)</text>
  <text x="360" y="432" fill="#059669" font-size="11" text-anchor="middle">"still running" → "finished" + output</text>

  <path d="M 590 342 C 590 420 500 420 482 420" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 360 448 C 360 480 200 480 150 170" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="225" y="470" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">result fed back on a later turn</text>

  <!-- footer note -->
  <rect x="60" y="478" width="600" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="498" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Sync = invoke + wait fused. Background = start (handle) + harvest (later) split.</text>
  <text x="360" y="516" fill="#64748b" font-size="11" text-anchor="middle">s13 · Background Tasks · codex exec (non-interactive)</text>
</svg>
