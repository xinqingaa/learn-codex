<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Plugins, Apps &amp; Hooks — capabilities register around one loop</text>

  <!-- Marketplace snapshot -->
  <rect x="36" y="96" width="192" height="142" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="132" y="120" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Marketplace snapshot</text>
  <text x="132" y="140" fill="#2563eb" font-size="11" text-anchor="middle">plugin.json</text>
  <text x="132" y="166" fill="#334155" font-size="11" text-anchor="middle">skills · hooks</text>
  <text x="132" y="186" fill="#334155" font-size="11" text-anchor="middle">mcpServers · apps</text>
  <text x="132" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">one installable bundle</text>

  <!-- Registry -->
  <rect x="300" y="96" width="168" height="142" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="384" y="120" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">Registry</text>
  <text x="384" y="146" fill="#334155" font-size="11" text-anchor="middle">skills[]</text>
  <text x="384" y="166" fill="#334155" font-size="11" text-anchor="middle">hooks[]</text>
  <text x="384" y="186" fill="#334155" font-size="11" text-anchor="middle">mcpServers[]</text>
  <text x="384" y="210" fill="#94a3b8" font-size="9" text-anchor="middle">merged onto defaults</text>

  <!-- Agent loop -->
  <rect x="520" y="96" width="164" height="142" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="602" y="122" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Agent loop (s01)</text>
  <text x="602" y="146" fill="#93c5fd" font-size="11" text-anchor="middle">model + tools</text>
  <text x="602" y="170" fill="#93c5fd" font-size="11" text-anchor="middle">unchanged</text>
  <text x="602" y="210" fill="#64748b" font-size="9" text-anchor="middle">hooks fire around it</text>

  <!-- arrows top -->
  <line x1="228" y1="167" x2="298" y2="167" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="263" y="158" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">plugin add</text>
  <line x1="468" y1="167" x2="518" y2="167" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="493" y="158" fill="#64748b" font-size="10" text-anchor="middle">arms</text>

  <!-- session-scoped hook pills -->
  <rect x="36" y="262" width="200" height="34" rx="17" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="136" y="283" fill="#4338ca" font-size="11" font-weight="600" text-anchor="middle">SessionStart → inject context</text>
  <rect x="252" y="262" width="180" height="34" rx="17" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="342" y="283" fill="#4338ca" font-size="11" font-weight="600" text-anchor="middle">UserPromptSubmit</text>
  <rect x="448" y="262" width="236" height="34" rx="17" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="566" y="283" fill="#4338ca" font-size="11" font-weight="600" text-anchor="middle">Stop → turn complete · notify</text>

  <!-- one tool call, hooked -->
  <rect x="36" y="330" width="128" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="354" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">function_call</text>
  <text x="100" y="372" fill="#059669" font-size="10" text-anchor="middle">model wants a tool</text>

  <rect x="200" y="330" width="150" height="58" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="354" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">PreToolUse hook</text>
  <text x="275" y="372" fill="#b45309" font-size="10" text-anchor="middle">may BLOCK the call</text>

  <rect x="392" y="330" width="120" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="452" y="354" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">tool runs</text>
  <text x="452" y="372" fill="#059669" font-size="10" text-anchor="middle">shell</text>

  <rect x="548" y="330" width="136" height="58" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="616" y="354" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">PostToolUse hook</text>
  <text x="616" y="372" fill="#b45309" font-size="10" text-anchor="middle">audit · log</text>

  <!-- pipeline arrows -->
  <line x1="164" y1="359" x2="198" y2="359" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="359" x2="390" y2="359" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="370" y="350" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">allow</text>
  <line x1="512" y1="359" x2="546" y2="359" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- BLOCKED branch -->
  <line x1="275" y1="388" x2="275" y2="424" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <rect x="200" y="426" width="150" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="275" y="446" fill="#b91c1c" font-size="12" font-weight="600" text-anchor="middle">BLOCKED</text>
  <text x="275" y="463" fill="#dc2626" font-size="10" text-anchor="middle">tool never runs</text>

  <!-- codex mcp-server note -->
  <rect x="392" y="426" width="292" height="46" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="538" y="446" fill="#075985" font-size="11" font-weight="600" text-anchor="middle">codex mcp-server</text>
  <text x="538" y="463" fill="#0284c7" font-size="10" text-anchor="middle">Codex itself served as an MCP server (stdio)</text>

  <!-- footer note -->
  <rect x="60" y="484" width="600" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="504" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The loop never changes — a plugin registers capabilities; hooks fire around it.</text>
  <text x="360" y="521" fill="#64748b" font-size="11" text-anchor="middle">s24 · Plugins, Apps &amp; Hooks</text>
</svg>
