<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Sessions, Sandbox &amp; Safety — the autonomy dial</text>

  <!-- ═══ LEFT: session lifecycle ═══ -->
  <text x="150" y="76" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">session lifecycle</text>

  <rect x="60" y="88" width="180" height="34" rx="8" fill="#111827"/>
  <text x="150" y="109" fill="#fff" font-size="11.5" font-weight="700" text-anchor="middle">active session (rollout)</text>

  <!-- resume loops back -->
  <path d="M 60 105 C 30 105 30 150 58 150" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="26" y="132" fill="#1e40af" font-size="10" text-anchor="middle" transform="rotate(-90 26 132)">resume</text>

  <!-- fork branches -->
  <line x1="150" y1="122" x2="150" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="60" y="152" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="171" fill="#1e3a8a" font-size="11" text-anchor="middle">fork → independent branch</text>

  <!-- archive / delete -->
  <line x1="150" y1="182" x2="150" y2="210" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="60" y="212" width="86" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="103" y="231" fill="#475569" font-size="10.5" text-anchor="middle">archive</text>
  <rect x="154" y="212" width="86" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="197" y="231" fill="#b91c1c" font-size="10.5" text-anchor="middle">delete</text>
  <text x="150" y="262" fill="#64748b" font-size="10" text-anchor="middle">archive only hides · delete is forever</text>

  <!-- ═══ RIGHT: the safety resolver funnel ═══ -->
  <text x="480" y="76" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">the safety resolver — can this run?</text>

  <rect x="400" y="88" width="240" height="30" rx="6" fill="#fff" stroke="#111827" stroke-width="1.6"/>
  <text x="520" y="107" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">proposed action (shell / hook / tool)</text>

  <line x1="520" y1="118" x2="520" y2="142" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- gate 1 feature -->
  <rect x="400" y="144" width="240" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="410" y="162" fill="#1e3a8a" font-size="11" font-weight="700">1 · feature gate</text>
  <text x="410" y="178" fill="#3b82f6" font-size="10">--enable / codex features … capability on?</text>

  <line x1="520" y1="186" x2="520" y2="210" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- gate 2 bypass -->
  <rect x="400" y="212" width="240" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="410" y="230" fill="#92400e" font-size="11" font-weight="700">2 · bypass?</text>
  <text x="410" y="246" fill="#d97706" font-size="10">--dangerously-bypass-* → skip the rest</text>

  <line x1="520" y1="254" x2="520" y2="278" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- gate 3 sandbox -->
  <rect x="400" y="280" width="240" height="42" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="410" y="298" fill="#5b21b6" font-size="11" font-weight="700">3 · sandbox gate</text>
  <text x="410" y="314" fill="#7c3aed" font-size="10">sandbox_mode + --add-dir · Seatbelt/Landlock</text>

  <line x1="520" y1="322" x2="520" y2="346" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- gate 4 approval/trust/guardian -->
  <rect x="400" y="348" width="240" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="410" y="366" fill="#065f46" font-size="11" font-weight="700">4 · approval · trust · guardian</text>
  <text x="410" y="382" fill="#059669" font-size="10">approval_policy + project trust + guardian_approval</text>

  <line x1="520" y1="394" x2="520" y2="420" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- verdicts -->
  <rect x="330" y="422" width="120" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="390" y="443" fill="#15803d" font-size="12" font-weight="700" text-anchor="middle">ALLOW</text>
  <rect x="462" y="422" width="120" height="34" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="522" y="443" fill="#a16207" font-size="12" font-weight="700" text-anchor="middle">ASK</text>
  <rect x="594" y="422" width="110" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="649" y="443" fill="#b91c1c" font-size="12" font-weight="700" text-anchor="middle">DENY</text>

  <!-- deny short-circuit notes on the left of the funnel -->
  <text x="388" y="166" fill="#dc2626" font-size="9.5" text-anchor="end">deny ↯</text>
  <text x="388" y="302" fill="#dc2626" font-size="9.5" text-anchor="end">deny ↯</text>

  <!-- footer -->
  <rect x="60" y="486" width="600" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="504" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">fork branches a session, archive only hides it — and every action clears four gates.</text>
  <text x="360" y="521" fill="#64748b" font-size="11" text-anchor="middle">s28 · Sessions, Sandbox &amp; Safety in Depth</text>
</svg>
