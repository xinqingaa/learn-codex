name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chapters:
    name: Type-check & smoke-test chapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check all chapters
        run: npx tsc --noEmit
      - name: Offline smoke test (all chapters)
        run: npx tsx scripts/run-all.ts

  web:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build (extract content + next build)
        run: npm run build
        working-directory: web
