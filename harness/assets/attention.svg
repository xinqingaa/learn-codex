<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs>
<pattern id="hazard" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fde3e3"/><line x1="0" y1="0" x2="0" y2="10" stroke="#e8a3a3" stroke-width="4"/></pattern>
<marker id="arr-muted" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#9aa8a5"/></marker>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="72" font-size="34" fill="#1f2a28" text-anchor="start" font-weight="650">上下文窗口：四条注意力预算路径</text>
<text x="64" y="104" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">四件事看起来都是「上下文不够用」，但成本结构完全不同，所以不能用同一招去解</text>
