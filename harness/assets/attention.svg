<line x1="153.84615384615384" y1="160" x2="153.84615384615384" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="207.69230769230768" y1="160" x2="207.69230769230768" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="261.53846153846155" y1="160" x2="261.53846153846155" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="315.38461538461536" y1="160" x2="315.38461538461536" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="369.2307692307692" y1="160" x2="369.2307692307692" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="423.0769230769231" y1="160" x2="423.0769230769231" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
