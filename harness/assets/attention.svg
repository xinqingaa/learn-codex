<line x1="584.6153846153846" y1="160" x2="584.6153846153846" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="638.4615384615385" y1="160" x2="638.4615384615385" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="692.3076923076923" y1="160" x2="692.3076923076923" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="746.1538461538462" y1="160" x2="746.1538461538462" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
