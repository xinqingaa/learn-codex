<line x1="907.6923076923077" y1="160" x2="907.6923076923077" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="961.5384615384615" y1="160" x2="961.5384615384615" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1015.3846153846154" y1="160" x2="1015.3846153846154" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1069.2307692307693" y1="160" x2="1069.2307692307693" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1123.076923076923" y1="160" x2="1123.076923076923" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1176.923076923077" y1="160" x2="1176.923076923077" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1230.7692307692307" y1="160" x2="1230.7692307692307" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1284.6153846153845" y1="160" x2="1284.6153846153845" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1338.4615384615386" y1="160" x2="1338.4615384615386" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1392.3076923076924" y1="160" x2="1392.3076923076924" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<line x1="1446.1538461538462" y1="160" x2="1446.1538461538462" y2="212" stroke="#dbe3e1" stroke-width="1.2"/>
<rect x="1230.7692307692307" y="150" width="269.2307692307692" height="72" rx="0" fill="url(#hazard)" opacity="0.9"/>
<rect x="100" y="150" width="1400" height="72" rx="12" fill="none" stroke="#5b6b67" stroke-width="1.6"/>
<text x="116" y="192.0" font-size="16" fill="#334846" text-anchor="start" font-weight="600">上下文窗口 —— 模型这一轮唯一能看见的输入，读完即忘</text>
<text x="1365.3846153846155" y="136" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">临近容量上限</text>
<line x1="265.0" y1="222" x2="265.0" y2="300" stroke="#97691f" stroke-width="1.6" stroke-dasharray="3 5" marker-end="url(#arr-muted)"/>
<text x="265.0" y="262" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">计划只在模型脑子里</text>
<rect x="100" y="300" width="330" height="430" rx="16" fill="#faf3e7" stroke="#97691f" stroke-width="2.5"/>
<circle cx="144" cy="344" r="26" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(127.8,327.8) scale(1.35)" fill="none" stroke="#97691f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="19" rx="2"/><rect x="9" y="1.2" width="6" height="3.2" rx="1"/><path d="M7.5,11 L9.5,13 L13,8.5"/><line x1="7.5" y1="16" x2="16" y2="16"/><line x1="7.5" y1="19" x2="14" y2="19"/></g>
<text x="182" y="338" font-size="20" fill="#5c400f" text-anchor="start" font-weight="650">外化计划</text>
<text x="182" y="360" font-size="12" fill="#5b6b67" text-anchor="start" font-weight="400">第一条路径</text>
<text x="122" y="398" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">把步骤表整体交给 harness 持有，</text>
<text x="122" y="420" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">同一时刻只允许一步在进行中。</text>
<rect x="122" y="612" width="286" height="36" rx="8" fill="#ecfdf5" stroke="none"/>
<text x="134" y="636" font-size="13" fill="#065f46" text-anchor="start" font-weight="600">✓ 换来能见度</text>
<rect x="122" y="658" width="286" height="52" rx="8" fill="#fff7ed" stroke="none"/>
<text x="134" y="678" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">✗ 换不来约束力：模型照样能跳步</text>
<text x="134" y="698" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600"></text>
<line x1="625.0" y1="222" x2="625.0" y2="300" stroke="#70579c" stroke-width="1.6" stroke-dasharray="3 5" marker-end="url(#arr-muted)"/>
<text x="625.0" y="262" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">支线淹没主线</text>
<rect x="460" y="300" width="330" height="430" rx="16" fill="#f3effa" stroke="#70579c" stroke-width="2.5"/>
<circle cx="504" cy="344" r="26" fill="#ffffff" stroke="#70579c" stroke-width="1.6"/>
<g transform="translate(487.8,327.8) scale(1.35)" fill="none" stroke="#70579c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6,6 V18"/><path d="M6,12 Q6,12 16,12"/></g>
<text x="542" y="338" font-size="20" fill="#42315e" text-anchor="start" font-weight="650">干净上下文</text>
<text x="542" y="360" font-size="12" fill="#5b6b67" text-anchor="start" font-weight="400">第二条路径</text>
<text x="482" y="398" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">同一循环换一份全新输入；工具表</text>
<text x="482" y="420" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">收窄，只有结论穿回主线。</text>
<rect x="482" y="612" width="286" height="36" rx="8" fill="#ecfdf5" stroke="none"/>
<text x="494" y="636" font-size="13" fill="#065f46" text-anchor="start" font-weight="600">✓ 换来主线清洁度</text>
<rect x="482" y="658" width="286" height="52" rx="8" fill="#fff7ed" stroke="none"/>
<text x="494" y="678" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">✗ 多烧一份 token；短任务里</text>
<text x="494" y="698" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">纯亏</text>
<line x1="985.0" y1="222" x2="985.0" y2="300" stroke="#3268bf" stroke-width="1.6" stroke-dasharray="3 5" marker-end="url(#arr-muted)"/>
<text x="985.0" y="262" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">规范每轮都在烧钱</text>
<rect x="820" y="300" width="330" height="430" rx="16" fill="#eef3fc" stroke="#3268bf" stroke-width="2.5"/>
<circle cx="864" cy="344" r="26" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(847.8,327.8) scale(1.35)" fill="none" stroke="#3268bf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3,7 L3,20 L14,20 L14,7 Z" opacity="0.35"/><path d="M6,4 L6,17 L17,17 L17,4 Z" opacity="0.6"/><path d="M9,1 L9,14 L20,14 L20,4 L17,1 Z" fill="#3268bf" opacity="0.12"/><path d="M9,1 L9,14 L20,14 L20,4 L17,1 Z"/><path d="M17,1 L17,4 L20,4"/></g>
<text x="902" y="338" font-size="20" fill="#1d3a66" text-anchor="start" font-weight="650">知识分层</text>
<text x="902" y="360" font-size="12" fill="#5b6b67" text-anchor="start" font-weight="400">第三条路径</text>
<text x="842" y="398" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">目录层常驻——名字 + 一句话；</text>
<text x="842" y="420" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">正文层按名字查表、按需注入。</text>
<rect x="842" y="612" width="286" height="36" rx="8" fill="#ecfdf5" stroke="none"/>
<text x="854" y="636" font-size="13" fill="#065f46" text-anchor="start" font-weight="600">✓ 把每轮必付变成用到才付</text>
<rect x="842" y="658" width="286" height="52" rx="8" fill="#fff7ed" stroke="none"/>
<text x="854" y="678" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">✗ 正文进历史后仍会一路携带</text>
<text x="854" y="698" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600"></text>
<line x1="1345.0" y1="222" x2="1345.0" y2="300" stroke="#177b65" stroke-width="1.6" stroke-dasharray="3 5" marker-end="url(#arr-muted)"/>
<text x="1345.0" y="262" font-size="13.5" fill="#9a3412" text-anchor="middle" font-weight="600">历史只增不减</text>
<rect x="1180" y="300" width="330" height="430" rx="16" fill="#eaf5f1" stroke="#177b65" stroke-width="2.5"/>
<circle cx="1224" cy="344" r="26" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(1207.8,327.8) scale(1.35)" fill="none" stroke="#177b65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2,3 H22 L14,13 V20 L10,22 V13 Z"/></g>
<text x="1262" y="338" font-size="20" fill="#0f4a3f" text-anchor="start" font-weight="650">有损压缩</text>
<text x="1262" y="360" font-size="12" fill="#5b6b67" text-anchor="start" font-weight="400">第四条路径</text>
<text x="1202" y="398" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">硬上限之前，把旧历史交给一次</text>
<text x="1202" y="420" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">无工具调用总结，压成一条摘要。</text>
<rect x="1202" y="612" width="286" height="36" rx="8" fill="#ecfdf5" stroke="none"/>
<text x="1214" y="636" font-size="13" fill="#065f46" text-anchor="start" font-weight="600">✓ 换来无上限的会话长度</text>
<rect x="1202" y="658" width="286" height="52" rx="8" fill="#fff7ed" stroke="none"/>
<text x="1214" y="678" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">✗ 信息确实会丢；压多次就什么都不</text>
<text x="1214" y="698" font-size="13" fill="#9a3412" text-anchor="start" font-weight="600">剩</text>
<line x1="64" y1="776" x2="1536" y2="776" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="812" font-size="15.5" fill="#1f2a28" text-anchor="start" font-weight="400">共同前提：模型没有任何持久状态。它每一轮看到的「记忆」，就是 harness 这次递过去的那段输入。</text>
<text x="64" y="840" font-size="15.5" fill="#1f2a28" text-anchor="start" font-weight="400">所以「它忘了最初要干什么」和「它塞不进下一轮」是同一个问题的两面，都不是模型的缺陷。</text>
<text x="64" y="872" font-size="15.5" fill="#0f4a3f" text-anchor="start" font-weight="600">压缩换的是空间（有损，活在内存里）；持久化换的是寿命（无损，但不解决窗口问题）。两层都需要。</text>
</svg>
