<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1040" height="540" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">三道接缝加一个外部</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">加一个新机制时先回答它属于哪一类；归不进任何一类，通常意味着你要改循环——那就是设计错了</text>
<rect x="40" y="104" width="960" height="82" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="60" y="134" font-size="15.5" fill="#1e3a8a" text-anchor="start" font-weight="700">模型调用外套</text>
<text x="60" y="156" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">发请求的前后</text>
<text x="300" y="134" font-size="12.5" fill="#1e3a8a" text-anchor="start" font-weight="400">预算压缩 · 错误分类恢复 · 日志落盘 · 指令组装</text>
<text x="300" y="156" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">不关心模型要做什么，只关心这次调用本身</text>
<rect x="40" y="202" width="960" height="82" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="60" y="232" font-size="15.5" fill="#7f1d1d" text-anchor="start" font-weight="700">分发外套</text>
<text x="60" y="254" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">真正执行之前</text>
<text x="300" y="232" font-size="12.5" fill="#7f1d1d" text-anchor="start" font-weight="400">判定链：钩子信任 · 能力开关 · 总旁路 · 沙箱 · 审批与项目信任</text>
<text x="300" y="254" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">关心这个动作会对世界做什么</text>
<rect x="40" y="300" width="960" height="82" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="60" y="330" font-size="15.5" fill="#4c1d95" text-anchor="start" font-weight="700">注册表内侧</text>
<text x="60" y="352" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">按名字找到的那个处理函数</text>
<text x="300" y="330" font-size="12.5" fill="#4c1d95" text-anchor="start" font-weight="400">跑命令 · 打补丁 · 计划 · 知识加载 · 派生子循环 · 协议桥</text>
<text x="300" y="352" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">就是能力本身</text>
<rect x="40" y="398" width="960" height="82" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="60" y="428" font-size="15.5" fill="#475569" text-anchor="start" font-weight="700">循环之外</text>
<text x="60" y="450" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">完全在外面</text>
<text x="300" y="428" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400">调度器 · 外部触发源 · 前端与传输 · 配置解析</text>
<text x="300" y="450" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">它们把工作交进来或决定参数，但不在循环里</text>
<text x="40" y="512" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="400">挂错位置的典型症状：把策略写进提示词 · 让模型自己声明安全性 · 在循环里加条件分支 · 把调度器塞进循环 · 把界面事件流灌进模型上下文。</text>
</svg>
