<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="760" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">三道接缝，加一个外部</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">加一个新机制时先回答它属于哪一类；归不进任何一类，通常意味着要改循环本身——那就是设计错了</text>
<rect x="64" y="160" width="1472" height="110" rx="14" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="120" cy="215.0" r="30" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(103.2,198.2) scale(1.4)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M13,2 L5,14 H11 L9,22 L19,9 H13 Z" stroke-linejoin="round"/>
</g>
<text x="172" y="200" font-size="22" fill="#1d3a66" text-anchor="start" font-weight="700">模型调用外套</text>
<text x="172" y="226" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">发请求的前后</text>
<text x="444" y="200" font-size="16" fill="#1d3a66" text-anchor="start" font-weight="500">预算压缩 · 错误分类恢复 · 日志落盘 · 指令组装</text>
<text x="444" y="226" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">不关心模型要做什么，只关心这次调用本身</text>
<rect x="64" y="294" width="1472" height="110" rx="14" fill="#fbecec" stroke="#bd5254" stroke-width="2.4"/>
<circle cx="120" cy="349.0" r="30" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(103.2,332.2) scale(1.4)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,2 L21,6 V12 Q20,19 12,23 Q4,19 3,12 V6 Z"/><path d="M8,12 L11,15 L16,9"/>
</g>
<text x="172" y="334" font-size="22" fill="#7a2f31" text-anchor="start" font-weight="700">分发外套</text>
<text x="172" y="360" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">真正执行之前</text>
<text x="444" y="334" font-size="16" fill="#7a2f31" text-anchor="start" font-weight="500">判定链：钩子信任 → 能力开关 → 总旁路 → 沙箱 → 审批与项目信任</text>
<text x="444" y="360" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">关心这个动作会对世界做什么</text>
<rect x="64" y="428" width="1472" height="110" rx="14" fill="#f3effa" stroke="#70579c" stroke-width="2.4"/>
<circle cx="120" cy="483.0" r="30" fill="#ffffff" stroke="#70579c" stroke-width="1.6"/>
<g transform="translate(103.2,466.2) scale(1.4)" fill="none" stroke="#70579c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="4"/>
<line x1="20.4" y1="12.0" x2="23.0" y2="12.0"/>
<line x1="17.9" y1="17.9" x2="19.8" y2="19.8"/>
<line x1="12.0" y1="20.4" x2="12.0" y2="23.0"/>
<line x1="6.1" y1="17.9" x2="4.2" y2="19.8"/>
<line x1="3.6" y1="12.0" x2="1.0" y2="12.0"/>
<line x1="6.1" y1="6.1" x2="4.2" y2="4.2"/>
<line x1="12.0" y1="3.6" x2="12.0" y2="1.0"/>
<line x1="17.9" y1="6.1" x2="19.8" y2="4.2"/>
</g>
<text x="172" y="468" font-size="22" fill="#42315e" text-anchor="start" font-weight="700">注册表内侧</text>
<text x="172" y="494" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">按名字找到的那个处理函数</text>
<text x="444" y="468" font-size="16" fill="#42315e" text-anchor="start" font-weight="500">跑命令 · 打补丁 · 计划 · 知识加载 · 派生子循环 · 协议桥</text>
<text x="444" y="494" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">就是能力本身</text>
<rect x="64" y="562" width="1472" height="110" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="120" cy="617.0" r="30" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(103.2,600.2) scale(1.4)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M7,18 A4.5,4.5 0 0 1 6.5,9.1 A6,6 0 0 1 18,8.4 A4.5,4.5 0 0 1 18,18 Z"/>
</g>
<text x="172" y="602" font-size="22" fill="#334155" text-anchor="start" font-weight="700">循环之外</text>
<text x="172" y="628" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">完全在外面</text>
<text x="444" y="602" font-size="16" fill="#334155" text-anchor="start" font-weight="500">调度器 · 外部触发源 · 前端与传输 · 配置解析</text>
<text x="444" y="628" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">把工作交进来或决定参数，但不在循环里</text>
<text x="64" y="718" font-size="15" fill="#7a2f31" text-anchor="start" font-weight="600">挂错位置的典型症状：把策略写进提示词 · 让模型自己声明安全性 · 在循环里加条件分支 · 把调度器塞进循环 · 把界面事件流灌进模型上下文。</text>
</svg>
