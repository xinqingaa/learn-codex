<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">审批与沙箱是两道正交的门</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">「要不要先问人」和「物理上碰得到什么」是两个问题；焊成一道闸会同时失去两种调节能力</text>
<line x1="300" y1="700" x2="1280" y2="700" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="300" y1="700" x2="300" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="790.0" y="756" font-size="15" fill="#1f2a28" text-anchor="middle" font-weight="650">审批：什么时候停下来问人</text>
<text x="204" y="430.0" font-size="15" fill="#1f2a28" text-anchor="middle" font-weight="650" transform="rotate(-90 204 430.0)">沙箱：笼子有多小</text>
<line x1="417.6" y1="694" x2="417.6" y2="706" stroke="#94a3b8"/>
<text x="417.6" y="730" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">从不问</text>
<line x1="662.6" y1="694" x2="662.6" y2="706" stroke="#94a3b8"/>
<text x="662.6" y="730" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">危险才问</text>
<line x1="907.6" y1="694" x2="907.6" y2="706" stroke="#94a3b8"/>
<text x="907.6" y="730" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">按需问</text>
<line x1="1162.4" y1="694" x2="1162.4" y2="706" stroke="#94a3b8"/>
<text x="1162.4" y="730" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">除只读都问</text>
<line x1="294" y1="646.0" x2="306" y2="646.0" stroke="#94a3b8"/>
<text x="284" y="650.0" font-size="13" fill="#5b6b67" text-anchor="end" font-weight="400">完全放开</text>
<line x1="294" y1="430.0" x2="306" y2="430.0" stroke="#94a3b8"/>
<text x="284" y="434.0" font-size="13" fill="#5b6b67" text-anchor="end" font-weight="400">工作区可写</text>
<line x1="294" y1="214.0" x2="306" y2="214.0" stroke="#94a3b8"/>
<text x="284" y="218.0" font-size="13" fill="#5b6b67" text-anchor="end" font-weight="400">只读</text>
<rect x="358.8" y="527.2" width="294.0" height="140.4" rx="10" fill="#fbecec" stroke="#bd5254" stroke-width="1.8"/>
<text x="505.8" y="557.2" font-size="14.5" fill="#7a2f31" text-anchor="middle" font-weight="650">无人监管的全权限</text>
<text x="505.8" y="581.2" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">门都没关，人也不在</text>
<text x="505.8" y="598.2" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">只该在环境本身已隔离时用</text>
<rect x="731.2" y="192.39999999999998" width="294.0" height="151.20000000000002" rx="10" fill="#fbecec" stroke="#bd5254" stroke-width="1.8"/>
<text x="878.2" y="222.39999999999998" font-size="14.5" fill="#7a2f31" text-anchor="middle" font-weight="650">事事确认 + 只读</text>
<text x="878.2" y="246.39999999999998" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">安全但不可用</text>
<text x="878.2" y="263.4" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">第五十次弹窗时人会下意识回车</text>
<rect x="535.2" y="365.19999999999993" width="313.6" height="151.20000000000002" rx="10" fill="#eaf5f1" stroke="#177b65" stroke-width="1.8"/>
<text x="692.0" y="395.19999999999993" font-size="14.5" fill="#0f4a3f" text-anchor="middle" font-weight="650">日常工作区</text>
<text x="692.0" y="419.19999999999993" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">写在笼子里，危险动作问人</text>
<text x="692.0" y="436.19999999999993" font-size="12" fill="#5b6b67" text-anchor="middle" font-weight="400">两个旋钮各自可调</text>
<text x="64" y="800" font-size="17" fill="#1f2a28" text-anchor="start" font-weight="650">落地顺序</text>
<text x="64" y="826" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">先按沙箱档位关进笼子；因权限不足而失败时才弹审批、批准后提权重跑。</text>
<text x="64" y="850" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">不是「区内审批、区外沙箱」——两枚保险丝在同一次动作里依次起作用。</text>
<rect x="1290" y="130" width="280" height="120" rx="10" fill="#fbecec" stroke="#bd5254" stroke-width="1.8"/>
<circle cx="1314" cy="156" r="13" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(1306.2,148.2) scale(0.65)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,3 L22,20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="1" fill="#bd5254"/>
</g>
<text x="1334" y="161" font-size="14" fill="#7a2f31" text-anchor="start" font-weight="650">只做审批，不做沙箱</text>
<text x="1308" y="184" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">批准 = 无限授权</text>
<text x="1308" y="204" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">一个被批准的删除命令</text>
<text x="1308" y="224" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">照样能清空磁盘</text>
<text x="1308" y="244" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">边界押在人的注意力上 = 没有边界</text>
<rect x="1290" y="274" width="280" height="120" rx="10" fill="#fbecec" stroke="#bd5254" stroke-width="1.8"/>
<circle cx="1314" cy="300" r="13" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(1306.2,292.2) scale(0.65)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,3 L22,20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="1" fill="#bd5254"/>
</g>
<text x="1334" y="305" font-size="14" fill="#7a2f31" text-anchor="start" font-weight="650">只做沙箱，不做审批</text>
<text x="1308" y="328" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">笼内的危险动作全放行</text>
<text x="1308" y="348" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">删掉整个构建目录、强制推送——</text>
<text x="1308" y="368" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">路径都在可写范围内</text>
<text x="1308" y="388" font-size="11.5" fill="#5b6b67" text-anchor="start" font-weight="400">沙箱回答「能碰到哪」，不回答「该不该碰」</text>
<text x="64" y="70" font-size="1" fill="#1f2a28" text-anchor="start" font-weight="400"></text>
<text x="64" y="890" font-size="15" fill="#1f2a28" text-anchor="start" font-weight="400">强制力一旦依赖「harness 记得去检查」，它就不是硬边界。真正的沙箱由操作系统内核执行。</text>
</svg>
