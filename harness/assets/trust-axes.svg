<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1040" height="600" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">审批与沙箱是两道正交的门</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">「要不要先问人」和「物理上碰得到什么」是两个问题；焊成一道闸会同时失去两种调节能力</text>
<line x1="150" y1="460" x2="710" y2="460" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="150" y1="460" x2="150" y2="120" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="430.0" y="504" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">审批：什么时候停下来问人</text>
<text transform="translate(66 290.0) rotate(-90)" x="0" y="0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">沙箱：笼子有多小</text>
<text x="220" y="482" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">从不问</text>
<line x1="220" y1="456" x2="220" y2="464" stroke="#94a3b8"/>
<text x="365" y="482" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">危险才问</text>
<line x1="365" y1="456" x2="365" y2="464" stroke="#94a3b8"/>
<text x="510" y="482" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">按需问</text>
<line x1="510" y1="456" x2="510" y2="464" stroke="#94a3b8"/>
<text x="655" y="482" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">除只读都问</text>
<line x1="655" y1="456" x2="655" y2="464" stroke="#94a3b8"/>
<text x="136" y="404" font-size="12" fill="#64748b" text-anchor="end" font-weight="400">完全放开</text>
<line x1="146" y1="400" x2="154" y2="400" stroke="#94a3b8"/>
<text x="136" y="294" font-size="12" fill="#64748b" text-anchor="end" font-weight="400">工作区可写</text>
<line x1="146" y1="290" x2="154" y2="290" stroke="#94a3b8"/>
<text x="136" y="184" font-size="12" fill="#64748b" text-anchor="end" font-weight="400">只读</text>
<line x1="146" y1="180" x2="154" y2="180" stroke="#94a3b8"/>
<rect x="166" y="364" width="220" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="276.0" y="393.0" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="600">无人监管的全权限</text>
<text x="276.0" y="408.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">门都没关，人也不在</text>
<text x="276.0" y="424.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">只该在环境本身已隔离时用</text>
<rect x="450" y="130" width="244" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="572.0" y="159.0" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="600">事事确认 + 只读</text>
<text x="572.0" y="174.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">安全但不可用</text>
<text x="572.0" y="190.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">第五十次弹窗时人会下意识回车</text>
<rect x="300" y="248" width="250" height="82" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="425.0" y="279.0" font-size="13" fill="#064e3b" text-anchor="middle" font-weight="600">日常工作区</text>
<text x="425.0" y="294.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">写在笼子里，危险动作问人</text>
<text x="425.0" y="310.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">两个旋钮各自可调</text>
<rect x="748" y="108" width="262" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="879.0" y="133.25" font-size="13.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">只做审批，不做沙箱</text>
<text x="879.0" y="148.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">批准 = 无限授权</text>
<text x="879.0" y="164.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">一个被批准的删除命令</text>
<text x="879.0" y="179.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">照样能清空磁盘</text>
<text x="879.0" y="195.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400"></text>
<text x="879.0" y="210.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">边界押在人的注意力上</text>
<text x="879.0" y="226.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">= 没有边界</text>
<rect x="748" y="256" width="262" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="879.0" y="281.25" font-size="13.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">只做沙箱，不做审批</text>
<text x="879.0" y="296.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">笼内的危险动作全放行</text>
<text x="879.0" y="312.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">删掉整个构建目录、强制推送</text>
<text x="879.0" y="327.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">路径都在可写范围内</text>
<text x="879.0" y="343.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400"></text>
<text x="879.0" y="358.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">沙箱回答「能碰到哪」</text>
<text x="879.0" y="374.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">不回答「该不该碰」</text>
<rect x="748" y="404" width="262" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="879.0" y="419.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">落地顺序</text>
<text x="879.0" y="434.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">先按沙箱档位关进笼子</text>
<text x="879.0" y="450.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">因权限不足而失败时</text>
<text x="879.0" y="465.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">才弹审批、批准后提权重跑</text>
<text x="879.0" y="481.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400"></text>
<text x="879.0" y="496.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">不是「区内审批、区外沙箱」</text>
<text x="40" y="552" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">强制力一旦依赖「harness 记得去检查」，它就不是硬边界。真正的沙箱由操作系统内核执行。</text>
</svg>
