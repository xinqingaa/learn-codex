<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">一个动作生命周期里的五个环节</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">agent = model + harness；model 只负责生成决定，感知、行动、执行、验证、约束全部是 harness 的工作</text>
<path d="M963.5,253.8 A478,228 0 0 1 1176.7,327.6" fill="none" stroke="#b7c0bd" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#arr)"/>
<path d="M1277.7,476.0 A478,228 0 0 1 1196.3,595.5" fill="none" stroke="#b7c0bd" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#arr)"/>
<path d="M931.8,687.2 A478,228 0 0 1 668.2,687.2" fill="none" stroke="#b7c0bd" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#arr)"/>
<path d="M403.7,595.5 A478,228 0 0 1 322.3,476.0" fill="none" stroke="#b7c0bd" stroke-width="1.8" stroke-dasharray="2 6" marker-end="url(#arr)"/>
<path d="M423.3,327.6 A478,228 0 0 1 636.5,253.8" fill="none" stroke="#bd5254" stroke-width="2.6" marker-end="url(#arr)"/>
<circle cx="800" cy="468" r="132" fill="#f6f7f6" stroke="#5b6b67" stroke-width="1.6" stroke-dasharray="3 5"/>
<text x="800" y="458" text-anchor="middle"><tspan font-size="27" font-weight="800" fill="#1d3a66">agent</tspan><tspan font-size="19" font-weight="500" fill="#334846"> = model + harness</tspan></text>
<line x1="730" y1="482" x2="870" y2="482" stroke="#d7dedb" stroke-width="1.2"/>
<text x="800" y="506" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">model 只出一个决定</text>
<text x="800" y="526" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">其余五环全部是 harness 的工作</text>
<rect x="675.0" y="156.0" width="250" height="168" rx="16" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="800.0" cy="200.0" r="26" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(783.8,183.8) scale(1.35)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2,12 Q12,3 22,12 Q12,21 2,12 Z"/><circle cx="12" cy="12" r="3.6"/></g>
<text x="800.0" y="248.0" font-size="22" fill="#1d3a66" text-anchor="middle" font-weight="650">感知</text>
<text x="800.0" y="270.0" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">context</text>
<text x="800.0" y="298.0" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">这一轮该看见什么</text>
<rect x="1129.6" y="313.5" width="250" height="168" rx="16" fill="#f3effa" stroke="#70579c" stroke-width="2.4"/>
<circle cx="1254.6" cy="357.5" r="26" fill="#ffffff" stroke="#70579c" stroke-width="1.6"/>
<g transform="translate(1238.4050147890832,341.34412528251204) scale(1.35)" fill="none" stroke="#70579c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14,4 A5,5 0 1 0 17.5,13 L21,16.5 L18.5,19 L15,15.5 A5,5 0 0 0 14,4 Z"/><path d="M4,20 L9,15"/></g>
<text x="1254.6050147890833" y="405.544125282512" font-size="22" fill="#42315e" text-anchor="middle" font-weight="650">行动</text>
<text x="1254.6050147890833" y="427.544125282512" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">tools</text>
<text x="1254.6050147890833" y="455.544125282512" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">意图如何变成可判定的请求</text>
<rect x="956.0" y="568.5" width="250" height="168" rx="16" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="1081.0" cy="612.5" r="26" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(1064.7613505958022,596.255874717488) scale(1.35)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,12 A8,8 0 1 1 7,17.6"/><path d="M3,20 L4.4,15.2 L9,17"/></g>
<text x="1080.9613505958023" y="660.4558747174881" font-size="22" fill="#0f4a3f" text-anchor="middle" font-weight="650">执行</text>
<text x="1080.9613505958023" y="682.4558747174881" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">恢复</text>
<text x="1080.9613505958023" y="710.4558747174881" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">请求如何在会失败的现实里跑完</text>
<rect x="394.0" y="568.5" width="250" height="168" rx="16" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="519.0" cy="612.5" r="26" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(502.83864940419795,596.255874717488) scale(1.35)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,10 L11,3 L16,8 L9,15 Z"/><line x1="9.5" y1="9.5" x2="4" y2="15" /><line x1="2" y1="20" x2="10" y2="20"/></g>
<text x="519.0386494041979" y="660.4558747174881" font-size="22" fill="#5c400f" text-anchor="middle" font-weight="650">验证</text>
<text x="519.0386494041979" y="682.4558747174881" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">判断力</text>
<text x="519.0386494041979" y="710.4558747174881" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">这个动作该不该发生</text>
<rect x="220.4" y="313.5" width="250" height="168" rx="16" fill="#fbecec" stroke="#bd5254" stroke-width="2.4"/>
<circle cx="345.4" cy="357.5" r="26" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(329.19498521091657,341.34412528251204) scale(1.35)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="11" rx="2"/><path d="M7,11 V7 a5,5 0 0 1 10,0 v4"/><circle cx="12" cy="16.5" r="1.6" fill="#bd5254"/></g>
<text x="345.39498521091656" y="405.544125282512" font-size="22" fill="#7a2f31" text-anchor="middle" font-weight="650">约束</text>
<text x="345.39498521091656" y="427.544125282512" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">硬边界</text>
<text x="345.39498521091656" y="455.544125282512" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">出错时损失被限制在哪</text>
<text x="64" y="826" font-size="16" fill="#7a2f31" text-anchor="start" font-weight="600">闭环，不是流水线：约束验证之后又回到下一轮的感知——五环首尾相接，没有终点。</text>
</svg>
