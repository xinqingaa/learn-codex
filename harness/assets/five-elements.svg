<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">一个动作生命周期里的五个环节</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">agent = model + harness；model 只负责生成决定，剩下的感知、行动、执行、验证、约束全部是 harness 的工作</text>
