<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="400" viewBox="0 0 1150 400" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1150" height="400" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">一个动作生命周期里的五个环节</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">agent = model + harness；model 只负责生成决定，剩下的感知、行动、执行、验证、约束全部是 harness 的工作</text>
<rect x="36.0" y="120" width="190" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="131.0" y="158" font-size="22" fill="#1e3a8a" text-anchor="middle" font-weight="700">感知</text>
<text x="131.0" y="184" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">context</text>
<text x="131.0" y="210" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">—— 回答 ——</text>
<text x="131.0" y="232" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">这一轮该</text>
<text x="131.0" y="250" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">看见什么</text>
<text x="131.0" y="290" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="600">第一部分</text>
<rect x="258.0" y="120" width="190" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="353.0" y="158" font-size="22" fill="#4c1d95" text-anchor="middle" font-weight="700">行动</text>
<text x="353.0" y="184" font-size="13.5" fill="#4c1d95" text-anchor="middle" font-weight="600">tools</text>
<text x="353.0" y="210" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">—— 回答 ——</text>
<text x="353.0" y="232" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">意图如何变成</text>
<text x="353.0" y="250" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">可判定的请求</text>
<text x="353.0" y="290" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="600">第二部分</text>
<path d="M230.0,195 L254.0,195" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="480.0" y="120" width="190" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="575.0" y="158" font-size="22" fill="#134e4a" text-anchor="middle" font-weight="700">执行</text>
<text x="575.0" y="184" font-size="13.5" fill="#134e4a" text-anchor="middle" font-weight="600">恢复</text>
<text x="575.0" y="210" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">—— 回答 ——</text>
<text x="575.0" y="232" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">请求如何在会失</text>
<text x="575.0" y="250" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">败的现实里跑完</text>
<text x="575.0" y="290" font-size="12" fill="#134e4a" text-anchor="middle" font-weight="600">第三部分</text>
<path d="M452.0,195 L476.0,195" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="702.0" y="120" width="190" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="797.0" y="158" font-size="22" fill="#78350f" text-anchor="middle" font-weight="700">验证</text>
<text x="797.0" y="184" font-size="13.5" fill="#78350f" text-anchor="middle" font-weight="600">判断力</text>
<text x="797.0" y="210" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">—— 回答 ——</text>
<text x="797.0" y="232" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">这个动作</text>
<text x="797.0" y="250" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">该不该发生</text>
<text x="797.0" y="290" font-size="12" fill="#78350f" text-anchor="middle" font-weight="600">第四部分</text>
<path d="M674.0,195 L698.0,195" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<rect x="924.0" y="120" width="190" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="1019.0" y="158" font-size="22" fill="#7f1d1d" text-anchor="middle" font-weight="700">约束</text>
<text x="1019.0" y="184" font-size="13.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">硬边界</text>
<text x="1019.0" y="210" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">—— 回答 ——</text>
<text x="1019.0" y="232" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">验证出错时损</text>
<text x="1019.0" y="250" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">失被限制在哪</text>
<text x="1019.0" y="290" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="600">第五部分</text>
<path d="M896.0,195 L920.0,195" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="350" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">这五件事不是五个独立模块，是同一个动作生命周期里的五个必经关卡——</text>
<text x="40" y="374" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">少了任何一关，系统就会在那个位置上失守；它们全部长在下一张图那同一个循环上。</text>
</svg>
