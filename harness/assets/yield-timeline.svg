<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">慢命令不阻塞：yield 窗口与收割</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">要解耦的不是「同步 vs 异步」，而是「这一次工具调用最多等多久」和「这个进程要跑多久」</text>
<line x1="80" y1="190" x2="1536" y2="190" stroke="#c7d0ce" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1536" y="176" font-size="13.5" fill="#5b6b67" text-anchor="end" font-weight="400">时间 →</text>
<rect x="120" y="220" width="200" height="46" rx="8" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="150" cy="243" r="16" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(140.4,233.4) scale(0.8)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M7.5,12.5 L10.3,15.3 L16.5,8.5"/>
</g>
<text x="176" y="248" font-size="15" fill="#0f4a3f" text-anchor="start" font-weight="650">快命令</text>
<line x1="360" y1="180" x2="360" y2="280" stroke="#177b65" stroke-dasharray="4 3"/>
<text x="376" y="256" font-size="14" fill="#177b65" text-anchor="start" font-weight="400">窗口内就结束了 → 返回完整输出 + 退出码，</text>
<text x="376" y="280" font-size="14" fill="#177b65" text-anchor="start" font-weight="400">和同步执行没有任何区别</text>
<rect x="120" y="330" width="720" height="46" rx="8" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="150" cy="353" r="16" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(140.4,343.4) scale(0.8)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M12,6.5 V12 L16,14.5"/>
</g>
<text x="176" y="358" font-size="15" fill="#5c400f" text-anchor="start" font-weight="650">慢命令（装依赖 / 跑构建）</text>
<line x1="420" y1="376" x2="420" y2="446" stroke="#97691f" stroke-width="2.4" marker-end="url(#arr)"/>
<text x="430" y="396" font-size="13.5" fill="#97691f" text-anchor="start" font-weight="700">窗口到期</text>
<rect x="230" y="446" width="340" height="62" rx="10" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<text x="400.0" y="474" font-size="15" fill="#5c400f" text-anchor="middle" font-weight="600">返回：会话句柄 + 目前输出</text>
<text x="400.0" y="496" font-size="15" fill="#5c400f" text-anchor="middle" font-weight="600">+ 仍在运行</text>
<line x1="570" y1="477.0" x2="620" y2="477.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="626" y="446" width="240" height="62" rx="10" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<text x="746" y="482.0" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="650">模型去干别的事</text>
<line x1="1066" y1="376" x2="1066" y2="446" stroke="#177b65" stroke-width="2.4" marker-end="url(#arr-g)"/>
<text x="1076" y="396" font-size="13.5" fill="#177b65" text-anchor="start" font-weight="700">更晚，某一轮收割</text>
<rect x="926" y="446" width="400" height="62" rx="10" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<text x="1126.0" y="474" font-size="15" fill="#0f4a3f" text-anchor="middle" font-weight="600">后续某一轮收割：</text>
<text x="1126.0" y="496" font-size="15" fill="#0f4a3f" text-anchor="middle" font-weight="600">只取上次切面之后的增量</text>
<rect x="64" y="568" width="720" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="84" y="602" font-size="17" fill="#334155" text-anchor="start" font-weight="700">给界面的事件流</text>
<text x="84" y="630" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">命令开始了 / 有新输出了 / 命令结束了</text>
<text x="84" y="654" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">终端靠它刷进度条</text>
<rect x="820" y="568" width="716" height="130" rx="12" fill="#fbecec" stroke="#bd5254" stroke-width="2.4"/>
<text x="840" y="602" font-size="17" fill="#7a2f31" text-anchor="start" font-weight="700">它不能自动灌进模型上下文</text>
<text x="840" y="630" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">量：一次构建几万行，会瞬间吃掉整个窗口</text>
<text x="840" y="654" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">控制权：模型该主动去看进度，而不是被进度淹没</text>
<text x="64" y="738" font-size="15" fill="#1f2a28" text-anchor="start" font-weight="400">要维护「已经给模型看过多少」的偏移量，每次收割只返回增量——否则模型会困惑于「这条日志怎么出现了三次」。</text>
</svg>
