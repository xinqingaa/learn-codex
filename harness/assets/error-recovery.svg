<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">失败是分类后的下一步，不是终点</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">生产环境里 API 报错是常态不是意外；四种情况的正确反应完全不同，走同一条路就像碰到减速带就熄火</text>
<rect x="64" y="220" width="190" height="170" rx="14" fill="#fbecec" stroke="#bd5254" stroke-width="2.4"/>
<circle cx="159.0" cy="270" r="26" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(143.4,254.4) scale(1.3)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,3 L22,20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="1" fill="#bd5254"/>
</g>
<text x="159.0" y="316" font-size="18" fill="#7a2f31" text-anchor="middle" font-weight="650">一次失败</text>
<text x="159.0" y="340" font-size="12.5" fill="#5b6b67" text-anchor="middle" font-weight="400">异常 / 非 2xx / 取消信号</text>
<line x1="254" y1="305.0" x2="304" y2="305.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="304" y="220" width="190" height="170" rx="14" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="399.0" cy="270" r="26" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(383.4,254.4) scale(1.3)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<polygon points="12,3 21,12 12,21 3,12"/><path d="M8.5,12 L11,14.5 L15.5,9"/>
</g>
<text x="399.0" y="316" font-size="18" fill="#1d3a66" text-anchor="middle" font-weight="650">分类器</text>
<text x="399.0" y="340" font-size="12.5" fill="#5b6b67" text-anchor="middle" font-weight="400">看信号，不看语义</text>
<rect x="550" y="170" width="986" height="108" rx="14" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="594" cy="224.0" r="22" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(581.4,211.4) scale(1.05)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M12,6.5 V12 L16,14.5"/>
</g>
<text x="630" y="202" font-size="17" fill="#5c400f" text-anchor="start" font-weight="650">限流 / 过载</text>
<text x="630" y="224" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">429、529 或对应关键词</text>
<text x="880" y="202" font-size="14" fill="#5c400f" text-anchor="start" font-weight="600">恢复：带抖动的指数退避，重试有上限</text>
<text x="880" y="226" font-size="13" fill="#7a2f31" text-anchor="start" font-weight="500">明确不做：不立刻放弃，也不无上限重试</text>
<polyline points="494,305.0 520,305.0 520,224.0 550,224.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="550" y="298" width="986" height="108" rx="14" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="594" cy="352.0" r="22" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(581.4,339.4) scale(1.05)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M2,3 H22 L14,13 V20 L10,22 V13 Z"/>
</g>
<text x="630" y="330" font-size="17" fill="#5c400f" text-anchor="start" font-weight="650">上下文超长</text>
<text x="630" y="352" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">413 或「超过最大上下文长度」</text>
<text x="880" y="330" font-size="14" fill="#5c400f" text-anchor="start" font-weight="600">恢复：压缩之后只再试一次</text>
<text x="880" y="354" font-size="13" fill="#7a2f31" text-anchor="start" font-weight="500">明确不做：不陷入「压缩、失败、再压缩」死循环</text>
<polyline points="494,305.0 520,305.0 520,352.0 550,352.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="550" y="426" width="986" height="108" rx="14" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="594" cy="480.0" r="22" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(581.4,467.4) scale(1.05)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M7.5,12.5 L10.3,15.3 L16.5,8.5"/>
</g>
<text x="630" y="458" font-size="17" fill="#0f4a3f" text-anchor="start" font-weight="650">用户中止</text>
<text x="630" y="480" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">取消信号</text>
<text x="880" y="458" font-size="14" fill="#0f4a3f" text-anchor="start" font-weight="600">恢复：立刻停当前轮，会话保留</text>
<text x="880" y="482" font-size="13" fill="#0f4a3f" text-anchor="start" font-weight="500">明确不做：不当成错误去重试</text>
<polyline points="494,305.0 520,305.0 520,480.0 550,480.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="550" y="554" width="986" height="108" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4"/>
<circle cx="594" cy="608.0" r="22" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(581.4,595.4) scale(1.05)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,3 L22,20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14.5"/><circle cx="12" cy="17.2" r="1" fill="#64748b"/>
</g>
<text x="630" y="586" font-size="17" fill="#334155" text-anchor="start" font-weight="650">未知</text>
<text x="630" y="608" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">其余一切</text>
<text x="880" y="586" font-size="14" fill="#334155" text-anchor="start" font-weight="600">恢复：少量重试后放弃</text>
<text x="880" y="610" font-size="13" fill="#7a2f31" text-anchor="start" font-weight="500">明确不做：不和限流走同一条路径</text>
<polyline points="494,305.0 520,305.0 520,608.0 550,608.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="672" width="430" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.4"/>
<text x="84" y="702" font-size="15" fill="#334155" text-anchor="start" font-weight="650">抖动为什么必要：</text>
<text x="84" y="728" font-size="13.5" fill="#5b6b67" text-anchor="start" font-weight="400">纯指数退避会让一群被同时限流的请求</text>
<text x="84" y="750" font-size="13.5" fill="#5b6b67" text-anchor="start" font-weight="400">在同一时刻一起重试，形成同步的重试风暴。</text>
<line x1="64" y1="818" x2="1536" y2="818" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="842" font-size="15" fill="#1f2a28" text-anchor="start" font-weight="400">两层分工：瞬时 HTTP 错误的退避放在模型客户端层（对上层透明）；超长与中止必须放在轮次层（它们要动上下文或会话状态）。</text>
<text x="64" y="870" font-size="14.5" fill="#7a2f31" text-anchor="start" font-weight="600">工具执行失败走另一条路：写成一条工具结果喂回去，循环继续。混在一起，一条失败的 shell 命令会触发退避重试。</text>
</svg>
