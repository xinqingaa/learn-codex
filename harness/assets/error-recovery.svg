<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1080" height="520" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">失败是分类后的下一步，不是终点</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">生产环境里 API 报错是常态不是意外；四种情况的正确反应完全不同，走同一条路就像碰到减速带就熄火</text>
<rect x="40" y="168" width="130" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="105.0" y="218.25" font-size="13.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">一次失败</text>
<text x="105.0" y="233.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">异常 / 非 2xx</text>
<text x="105.0" y="249.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">/ 取消信号</text>
<rect x="196" y="168" width="120" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="256.0" y="218.25" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">分类器</text>
<text x="256.0" y="233.75" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">看信号</text>
<text x="256.0" y="249.25" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">不看语义</text>
<path d="M170,228 L192,228" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="344" y="108" width="700" height="78" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="360" y="132" font-size="13.5" fill="#78350f" text-anchor="start" font-weight="600">限流 / 过载</text>
<text x="360" y="152" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">429、529 或对应关键词</text>
<text x="560" y="136" font-size="12" fill="#78350f" text-anchor="start" font-weight="400">恢复： 带抖动的指数退避，重试有上限</text>
<text x="560" y="158" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="400">明确不做： 不立刻放弃，也不无上限重试</text>
<polyline points="316,228 330,228 330,147 340,147" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="344" y="198" width="700" height="78" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="360" y="222" font-size="13.5" fill="#78350f" text-anchor="start" font-weight="600">上下文超长</text>
<text x="360" y="242" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">413 或「超过最大上下文长度」</text>
<text x="560" y="226" font-size="12" fill="#78350f" text-anchor="start" font-weight="400">恢复： 压缩之后只再试一次</text>
<text x="560" y="248" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="400">明确不做： 不陷入「压缩、失败、再压缩」死循环</text>
<polyline points="316,228 330,228 330,237 340,237" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="344" y="288" width="700" height="78" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
<text x="360" y="312" font-size="13.5" fill="#064e3b" text-anchor="start" font-weight="600">用户中止</text>
<text x="360" y="332" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">取消信号</text>
<text x="560" y="316" font-size="12" fill="#064e3b" text-anchor="start" font-weight="400">恢复： 立刻停当前轮，会话保留</text>
<text x="560" y="338" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="400">明确不做： 不当成错误去重试</text>
<polyline points="316,228 330,228 330,327 340,327" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="344" y="378" width="700" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="360" y="402" font-size="13.5" fill="#475569" text-anchor="start" font-weight="600">未知</text>
<text x="360" y="422" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">其余一切</text>
<text x="560" y="406" font-size="12" fill="#475569" text-anchor="start" font-weight="400">恢复： 少量重试后放弃</text>
<text x="560" y="428" font-size="11.5" fill="#b45309" text-anchor="start" font-weight="400">明确不做： 不和限流走同一条路径</text>
<polyline points="316,228 330,228 330,417 340,417" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
<text x="40" y="336" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="600">抖动为什么必要：</text>
<text x="40" y="356" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">纯指数退避会让一群</text>
<text x="40" y="374" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">被同时限流的请求在同</text>
<text x="40" y="392" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">一时刻一起重试，形成</text>
<text x="40" y="410" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">同步的重试风暴。</text>
<text x="40" y="486" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="400">两层分工：瞬时 HTTP 错误的退避放在模型客户端层（对上层透明）；超长与中止必须放在轮次层（它们要动上下文或会话状态）。</text>
<text x="40" y="508" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="400">工具执行失败走另一条路：写成一条工具结果喂回去，循环继续。混在一起，一条失败的 shell 命令会触发退避重试。</text>
</svg>
