<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="72" font-size="34" fill="#1f2a28" text-anchor="start" font-weight="650">「多执行者」其实是四件互相独立的事</text>
<text x="64" y="104" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">注意力怎么隔离、信息怎么传递、顺序怎么保证、文件在哪写——混在一起想，会设计出一团乱麻</text>
<line x1="720" y1="390" x2="755.2" y2="405.2" stroke="#c7d0ce" stroke-width="1.5" stroke-dasharray="3 5"/>
<line x1="880" y1="390" x2="844.8" y2="405.2" stroke="#c7d0ce" stroke-width="1.5" stroke-dasharray="3 5"/>
<line x1="720" y1="510" x2="755.2" y2="494.8" stroke="#c7d0ce" stroke-width="1.5" stroke-dasharray="3 5"/>
<line x1="880" y1="510" x2="844.8" y2="494.8" stroke="#c7d0ce" stroke-width="1.5" stroke-dasharray="3 5"/>
<circle cx="800.0" cy="450.0" r="64" fill="#f5f7f6" stroke="#5b6b67" stroke-width="1.6" stroke-dasharray="4 4"/>
<rect x="779.0" y="432.0" width="30" height="20" rx="3" fill="#ffffff" stroke="#5b6b67" stroke-width="1.6"/>
<rect x="783.0" y="427.0" width="30" height="20" rx="3" fill="#ffffff" stroke="#5b6b67" stroke-width="1.6"/>
<rect x="787.0" y="422.0" width="30" height="20" rx="3" fill="#ffffff" stroke="#5b6b67" stroke-width="1.6"/>
<text x="800.0" y="474.0" font-size="15" fill="#334846" text-anchor="middle" font-weight="650">共享资源</text>
<text x="800.0" y="492.0" font-size="11" fill="#5b6b67" text-anchor="middle" font-weight="400">任务队列 · 仓库 · 上下文</text>
<rect x="260" y="150" width="460" height="240" rx="16" fill="#eef3fc" stroke="#3268bf" stroke-width="2.5"/>
<circle cx="312" cy="202" r="30" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(294.0,184.0) scale(1.5)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4,4 H20 L22,13 V19 H2 V13 Z"/><path d="M2,13 H8 L10,16 H14 L16,13 H22"/></g>
<text x="356" y="196" font-size="22" fill="#1d3a66" text-anchor="start" font-weight="650">① 注意力边界</text>
<text x="292" y="250" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">各带一份私有上下文，用信箱传递消息，</text>
<text x="292" y="274" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">过境的内容必须被显式说出来。</text>
<rect x="284" y="332" width="412" height="40" rx="8" fill="#ffffff" opacity="0.75"/>
<text x="298" y="358" font-size="13.5" fill="#1d3a66" text-anchor="start" font-weight="600">没有它：支线几十轮的中间过程会淹没主线</text>
<rect x="880" y="150" width="460" height="240" rx="16" fill="#fbecec" stroke="#bd5254" stroke-width="2.5"/>
<circle cx="932" cy="202" r="30" fill="#ffffff" stroke="#bd5254" stroke-width="1.6"/>
<g transform="translate(914.0,184.0) scale(1.5)" fill="none" stroke="#bd5254" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12,2 L21,6 V12 Q20,19 12,23 Q4,19 3,12 V6 Z"/><path d="M8,12 L11,15 L16,9"/></g>
<text x="976" y="196" font-size="22" fill="#7a2f31" text-anchor="start" font-weight="650">② 规则边界</text>
<text x="912" y="250" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">任务携带自己的依赖集合，认领时</text>
<text x="912" y="274" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">逐条核对，不满足就拒绝领取。</text>
<rect x="904" y="332" width="412" height="40" rx="8" fill="#ffffff" opacity="0.75"/>
<text x="918" y="358" font-size="13.5" fill="#7a2f31" text-anchor="start" font-weight="600">没有它：全局执行顺序被悄悄破坏，且无法察觉</text>
<rect x="260" y="510" width="460" height="240" rx="16" fill="#faf3e7" stroke="#97691f" stroke-width="2.5"/>
<circle cx="312" cy="562" r="30" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(294.0,544.0) scale(1.5)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2,7 Q4,7 4,9 Q4,11 2,11 V15 Q4,15 4,17 Q4,19 2,19 V21 H22 V19 Q20,19 20,17 Q20,15 22,15 V11 Q20,11 20,9 Q20,7 22,7 V5 H2 Z"/><line x1="12" y1="7" x2="12" y2="21" stroke-dasharray="2 2.4" stroke-width="1.4"/></g>
<text x="356" y="556" font-size="22" fill="#5c400f" text-anchor="start" font-weight="650">③ 并发正确性</text>
<text x="292" y="610" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">每个请求带唯一 id 对账，认领时的</text>
<text x="292" y="634" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">复查与置位必须是一次原子操作。</text>
<rect x="284" y="692" width="412" height="40" rx="8" fill="#ffffff" opacity="0.75"/>
<text x="298" y="718" font-size="13.5" fill="#5c400f" text-anchor="start" font-weight="600">没有它：两个执行者会抢到同一份工作</text>
<rect x="880" y="510" width="460" height="240" rx="16" fill="#eaf5f1" stroke="#177b65" stroke-width="2.5"/>
<circle cx="932" cy="562" r="30" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(914.0,544.0) scale(1.5)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2,19 V6 Q2,4 4,4 H9 L11.5,7 H20 Q22,7 22,9 V19 Q22,21 20,21 H4 Q2,21 2,19 Z"/><circle cx="16" cy="14" r="1.2" fill="#177b65"/><path d="M16,14 V17 M16,14 L19,12"/></g>
<text x="976" y="556" font-size="22" fill="#0f4a3f" text-anchor="start" font-weight="650">④ 地盘边界</text>
<text x="912" y="610" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">各自持有一份独立工作目录，冲突</text>
<text x="912" y="634" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">被推迟到交回那一刻由 git 揭示。</text>
<rect x="904" y="692" width="412" height="40" rx="8" fill="#ffffff" opacity="0.75"/>
<text x="918" y="718" font-size="13.5" fill="#0f4a3f" text-anchor="start" font-weight="600">没有它：并行写入互相覆盖，事后无法分清归属</text>
<line x1="64" y1="786" x2="1536" y2="786" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="824" font-size="18" fill="#7a2f31" text-anchor="start" font-weight="650">前提：多执行者默认是亏的</text>
<text x="64" y="854" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">每个执行者独立消耗 token，总成本高于单个执行者；只有任务确实可拆、且每部分都有大量中间过程时才划算。</text>
<text x="64" y="886" font-size="15" fill="#0f4a3f" text-anchor="start" font-weight="400">主流产品默认只在用户明确要求并行时才派生子执行者——这个保守默认是对的。</text>
</svg>
