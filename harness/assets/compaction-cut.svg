<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="72" font-size="34" fill="#1f2a28" text-anchor="start" font-weight="650">压缩从哪里切</text>
<text x="64" y="104" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">上下文是有序序列，工具调用与结果成对出现；切分点落在两者之间，故障要十几轮之后才会显形</text>
<text x="100" y="176" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">时间 →</text>
<rect x="100" y="200" width="96" height="60" rx="8" fill="#eef3fc" stroke="#3268bf" stroke-width="1.8"/>
<text x="148.0" y="237" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="600">用户</text>
<rect x="210" y="200" width="96" height="60" rx="8" fill="#f3effa" stroke="#70579c" stroke-width="1.8"/>
<text x="258.0" y="237" font-size="16" fill="#42315e" text-anchor="middle" font-weight="600">调用</text>
<rect x="320" y="200" width="96" height="60" rx="8" fill="#eaf5f1" stroke="#177b65" stroke-width="1.8"/>
<text x="368.0" y="237" font-size="16" fill="#0f4a3f" text-anchor="middle" font-weight="600">结果</text>
<rect x="430" y="200" width="96" height="60" rx="8" fill="#eef3fc" stroke="#3268bf" stroke-width="1.8"/>
<text x="478.0" y="237" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="600">回复</text>
<rect x="540" y="200" width="96" height="60" rx="8" fill="#eef3fc" stroke="#3268bf" stroke-width="1.8"/>
<text x="588.0" y="237" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="600">用户</text>
<rect x="650" y="200" width="96" height="60" rx="8" fill="#f3effa" stroke="#70579c" stroke-width="1.8"/>
<text x="698.0" y="237" font-size="16" fill="#42315e" text-anchor="middle" font-weight="600">调用</text>
<rect x="760" y="200" width="96" height="60" rx="8" fill="#eaf5f1" stroke="#177b65" stroke-width="1.8"/>
<text x="808.0" y="237" font-size="16" fill="#0f4a3f" text-anchor="middle" font-weight="600">结果</text>
<rect x="870" y="200" width="96" height="60" rx="8" fill="#f3effa" stroke="#70579c" stroke-width="1.8"/>
<text x="918.0" y="237" font-size="16" fill="#42315e" text-anchor="middle" font-weight="600">调用</text>
<rect x="980" y="200" width="96" height="60" rx="8" fill="#eaf5f1" stroke="#177b65" stroke-width="1.8"/>
<text x="1028.0" y="237" font-size="16" fill="#0f4a3f" text-anchor="middle" font-weight="600">结果</text>
<rect x="1090" y="200" width="96" height="60" rx="8" fill="#eef3fc" stroke="#3268bf" stroke-width="1.8"/>
<text x="1138.0" y="237" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="600">用户</text>
<rect x="1200" y="200" width="96" height="60" rx="8" fill="#f3effa" stroke="#70579c" stroke-width="1.8"/>
<text x="1248.0" y="237" font-size="16" fill="#42315e" text-anchor="middle" font-weight="600">调用</text>
<rect x="1310" y="200" width="96" height="60" rx="8" fill="#eaf5f1" stroke="#177b65" stroke-width="1.8"/>
<text x="1358.0" y="237" font-size="16" fill="#0f4a3f" text-anchor="middle" font-weight="600">结果</text>
<line x1="753.0" y1="186" x2="753.0" y2="278" stroke="#bd5254" stroke-width="2.6" stroke-dasharray="6 5"/>
<circle cx="753.0" cy="160" r="15" fill="#ffffff" stroke="#bd5254" stroke-width="2"/>
<g stroke="#bd5254" stroke-width="2.4" stroke-linecap="round" fill="none"><line x1="747.0" y1="154" x2="759.0" y2="166"/><line x1="759.0" y1="154" x2="747.0" y2="166"/></g>
<text x="753.0" y="142" font-size="15" fill="#bd5254" text-anchor="middle" font-weight="700">坏切点</text>
<line x1="1083.0" y1="186" x2="1083.0" y2="278" stroke="#177b65" stroke-width="2.6"/>
<circle cx="1083.0" cy="160" r="15" fill="#ffffff" stroke="#177b65" stroke-width="2"/>
<g stroke="#177b65" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M1076.0,160 L1081.0,166 L1090.0,154"/></g>
<text x="1083.0" y="142" font-size="15" fill="#177b65" text-anchor="middle" font-weight="700">好切点：最后一条用户消息之前</text>
<rect x="100" y="340" width="660" height="260" rx="16" fill="#fbecec" stroke="#bd5254" stroke-width="2.2"/>
<circle cx="160" cy="396" r="15" fill="#ffffff" stroke="#bd5254" stroke-width="2"/>
<g stroke="#bd5254" stroke-width="2.4" stroke-linecap="round" fill="none"><line x1="154" y1="390" x2="166" y2="402"/><line x1="166" y1="390" x2="154" y2="402"/></g>
<text x="210" y="386" font-size="20" fill="#7a2f31" text-anchor="start" font-weight="650">坏切点：症状离病因很远</text>
<text x="210" y="414" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">压缩本身不报错，摘要生成得好好的</text>
<text x="140" y="470" font-size="16" fill="#7a2f31" text-anchor="start" font-weight="600">拆散了一对调用与结果，</text>
<text x="140" y="498" font-size="16" fill="#7a2f31" text-anchor="start" font-weight="600">下一次请求返回「找不到对应调用」。</text>
<text x="140" y="540" font-size="14.5" fill="#5b6b67" text-anchor="start" font-weight="400">错误信息只字不提压缩——你看到的只是「第 31 轮挂了」，</text>
<text x="140" y="564" font-size="14.5" fill="#5b6b67" text-anchor="start" font-weight="400">若归进「未知错误重试几次」，每次重试都带着同一份坏序列。</text>
<rect x="840" y="340" width="660" height="260" rx="16" fill="#eaf5f1" stroke="#177b65" stroke-width="2.2"/>
<circle cx="900" cy="396" r="15" fill="#ffffff" stroke="#177b65" stroke-width="2"/>
<g stroke="#177b65" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M893,396 L898,402 L907,390"/></g>
<text x="950" y="386" font-size="20" fill="#0f4a3f" text-anchor="start" font-weight="650">好切点：为什么安全</text>
<text x="950" y="414" font-size="15" fill="#5b6b67" text-anchor="start" font-weight="400">用户消息一定处在轮次边界上</text>
<text x="880" y="470" font-size="16" fill="#0f4a3f" text-anchor="start" font-weight="600">轮的定义就是从用户消息开始、</text>
<text x="880" y="498" font-size="16" fill="#0f4a3f" text-anchor="start" font-weight="600">到模型不再调工具为止——</text>
<text x="880" y="540" font-size="14.5" fill="#5b6b67" text-anchor="start" font-weight="400">在它之前切，绝不会拆散任何一对调用与结果，</text>
<text x="880" y="564" font-size="14.5" fill="#5b6b67" text-anchor="start" font-weight="400">被切掉的一段整体交给一次「无工具」的模型调用去总结。</text>
<line x1="64" y1="626" x2="1536" y2="626" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="656" font-size="16" fill="#1f2a28" text-anchor="start" font-weight="400">闸门放在「调模型之前」而不是「收到超长错误之后」：总结本身也要用一次模型调用，也要挤进同一个窗口——</text>
<text x="64" y="686" font-size="16" fill="#1f2a28" text-anchor="start" font-weight="400">等窗口满了再压，这次总结请求也发不出去，agent 会彻底卡死，这才是「提前压」的真正原因。</text>
<text x="64" y="722" font-size="14.5" fill="#5b6b67" text-anchor="start" font-weight="400">判断阈值用精确 token 用量而不是估算，差别不在精度本身，而在于它允许你把安全边际压到多小。</text>
</svg>
