<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">一个引擎，许多前端</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">复杂度几乎全在传输与协议侧；关键抽象是会话标识——一个前端开的会话，另一个前端能接着跑</text>
<circle cx="800" cy="460" r="240" fill="none" stroke="#dbe2e6" stroke-width="1.6" stroke-dasharray="3 7"/>
<text x="800" y="205" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">传输 / 协议层</text>
<rect x="615" y="275" width="370" height="370" rx="185" fill="#eef3fc" stroke="#3268bf" stroke-width="3"/>
<text x="800" y="416" font-size="28" fill="#1d3a66" text-anchor="middle" font-weight="700">引擎</text>
<text x="800" y="450" font-size="15.5" fill="#5b6b67" text-anchor="middle" font-weight="400">循环 + 会话存储</text>
<text x="800" y="482" font-size="16" fill="#1d3a66" text-anchor="middle" font-weight="650">每条会话一个 id</text>
<text x="800" y="512" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">开新会话 / 在某条会话上跑一轮</text>
<text x="800" y="532" font-size="13" fill="#5b6b67" text-anchor="middle" font-weight="400">= 同一个方法，不同参数</text>
<rect x="64" y="180.0" width="340" height="90" rx="14" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="106" cy="225.0" r="21" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(93.4,212.4) scale(1.05)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6,9 L10,12 L6,15"/><line x1="12" y1="15" x2="17" y2="15"/>
</g>
<text x="142" y="217.0" font-size="17" fill="#1d3a66" text-anchor="start" font-weight="650">终端</text>
<text x="142" y="243.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">进程内直连，无传输</text>
<path d="M404,225 L641,366" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="64" y="415.0" width="340" height="90" rx="14" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="106" cy="460.0" r="21" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(93.4,447.4) scale(1.05)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M5,2 H15 L19,6 V22 H5 Z"/><path d="M15,2 V6 H19"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/>
</g>
<text x="142" y="452.0" font-size="17" fill="#1d3a66" text-anchor="start" font-weight="650">编辑器扩展</text>
<text x="142" y="478.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">RPC 协议</text>
<path d="M404,460 L615,460" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="64" y="650.0" width="340" height="90" rx="14" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="106" cy="695.0" r="21" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(93.4,682.4) scale(1.05)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
</g>
<text x="142" y="687.0" font-size="17" fill="#1d3a66" text-anchor="start" font-weight="650">桌面应用</text>
<text x="142" y="713.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">RPC 协议</text>
<path d="M404,695 L641,554" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1196" y="180.0" width="340" height="90" rx="14" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="1494" cy="225.0" r="21" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(1481.4,212.4) scale(1.05)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M7,18 A4.5,4.5 0 0 1 6.5,9.1 A6,6 0 0 1 18,8.4 A4.5,4.5 0 0 1 18,18 Z"/>
</g>
<text x="1214" y="217.0" font-size="17" fill="#5c400f" text-anchor="start" font-weight="650">远程终端</text>
<text x="1214" y="243.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">WebSocket / Unix socket</text>
<path d="M1196,225 L959,366" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1196" y="415.0" width="340" height="90" rx="14" fill="#f3effa" stroke="#70579c" stroke-width="2.4"/>
<circle cx="1494" cy="460.0" r="21" fill="#ffffff" stroke="#70579c" stroke-width="1.6"/>
<g transform="translate(1481.4,447.4) scale(1.05)" fill="none" stroke="#70579c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M8,2 V9 M16,2 V9 M5,9 H19 V13 A7,7 0 0 1 5,13 Z"/><line x1="12" y1="17" x2="12" y2="22"/>
</g>
<text x="1214" y="452.0" font-size="17" fill="#42315e" text-anchor="start" font-weight="650">被当作外部工具</text>
<text x="1214" y="478.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">外部工具协议（另一个 agent 调它）</text>
<path d="M1196,460 L985,460" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="1196" y="650.0" width="340" height="90" rx="14" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="1494" cy="695.0" r="21" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(1481.4,682.4) scale(1.05)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M7,18 A4.5,4.5 0 0 1 6.5,9.1 A6,6 0 0 1 18,8.4 A4.5,4.5 0 0 1 18,18 Z"/>
</g>
<text x="1214" y="687.0" font-size="17" fill="#0f4a3f" text-anchor="start" font-weight="650">托管云服务</text>
<text x="1214" y="713.0" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">网络 / 云边界</text>
<path d="M1196,695 L959,554" fill="none" stroke="#b7c0bd" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="64" y1="776.0" x2="1536" y2="776.0" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="800.0" font-size="16" fill="#1f2a28" text-anchor="start" font-weight="400">如果每种形态重写一套 agent，那是维护灾难，而且行为会不一致。</text>
<text x="64" y="830.0" font-size="15" fill="#5c400f" text-anchor="start" font-weight="600">安全提醒：本机终端里人在现场；远程驱动下没有人在现场——审批弹给谁、沙箱按谁的策略配，都要重新想一遍。</text>
</svg>
