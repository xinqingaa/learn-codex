<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1080" height="560" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">隔离的三个级别，是包含关系不是并列选项</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">用目录隔离去解决「不信任这段代码」是错配；用容器去解决「别互相覆盖」是过度设计</text>
<rect x="90" y="110" width="340" height="300" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<rect x="130" y="150" width="260" height="220" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<rect x="170" y="190" width="180" height="140" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="260.0" y="254.0" font-size="13.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">工作目录隔离</text>
<text x="260.0" y="274.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">同一仓库另一份目录</text>
<text x="106" y="128" font-size="13.5" fill="#134e4a" text-anchor="start" font-weight="700">环境隔离</text>
<text x="106" y="144" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">容器 / 微型虚拟机</text>
<text x="146" y="168" font-size="13.5" fill="#7f1d1d" text-anchor="start" font-weight="700">沙箱</text>
<text x="146" y="184" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">落地执行上的笼子</text>
<rect x="640" y="108" width="400" height="128" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<text x="656" y="134" font-size="14" fill="#1e3a8a" text-anchor="start" font-weight="700">工作目录隔离</text>
<text x="656" y="156" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">隔： 工作区目录</text>
<text x="656" y="176" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">共享： 同一台机器、内核、对象库</text>
<text x="656" y="196" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">适用： 本机并行会话</text>
<text x="656" y="216" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">不适用： 约束不可信代码——它还在你机器上跑</text>
<polyline points="350,220.8 374,220.8 374,172 636,172" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="640" y="256" width="400" height="128" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<text x="656" y="282" font-size="14" fill="#7f1d1d" text-anchor="start" font-weight="700">沙箱</text>
<text x="656" y="304" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">隔： 当前目录之外的一切（含网络）</text>
<text x="656" y="324" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">共享： 同一台机器、同一个文件系统</text>
<text x="656" y="344" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">适用： 限制单个执行者的破坏半径</text>
<text x="656" y="364" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">不适用： 提供并行能力——它只管边界</text>
<polyline points="390,198.4 414,198.4 414,320 636,320" fill="none" stroke="#dc2626" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<rect x="640" y="404" width="400" height="128" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
<text x="656" y="430" font-size="14" fill="#134e4a" text-anchor="start" font-weight="700">环境隔离</text>
<text x="656" y="452" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">隔： 文件系统、进程、网络</text>
<text x="656" y="472" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">共享： 只共享宿主的硬件</text>
<text x="656" y="492" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">适用： 云端任务、不可信代码</text>
<text x="656" y="512" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">不适用： 日常本机——启动调试成本高一档</text>
<polyline points="430,260.0 454,260.0 454,468 636,468" fill="none" stroke="#0d9488" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/>
<text x="40" y="486" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">目录隔离的关键性质：真正的冲突不会消失，只是被推迟到交回那一刻由 git 诚实地暴露——</text>
<text x="40" y="508" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">这是特性不是缺陷，而不是以「文件被静默覆盖」的形式消失。</text>
<text x="40" y="538" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">工作目录由 harness 在会话启动时定，模型没有「创建工作目录」这个工具——目录归属属于编排层的决定。</text>
</svg>
