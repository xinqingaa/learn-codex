<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" font-family="'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif">
<rect width="1060" height="480" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<text x="36" y="40" font-size="21" fill="#0f172a" text-anchor="start" font-weight="600">隔离的三个级别，不要互相替代</text>
<text x="36" y="66" font-size="13" fill="#64748b" text-anchor="start" font-weight="400">用目录隔离去解决「不信任这段代码」是错配；用容器去解决「别互相覆盖」是过度设计</text>
<rect x="40" y="110" width="300" height="216" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="190" y="142" font-size="15.5" fill="#1e3a8a" text-anchor="middle" font-weight="700">工作目录隔离</text>
<text x="190" y="164" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">同一仓库开出另一份工作目录</text>
<text x="56" y="198" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">隔： 工作区目录</text>
<text x="56" y="230" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">共享： 同一台机器、同一个内核、同一份对象库</text>
<text x="56" y="262" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">适用： 本机并行会话</text>
<text x="56" y="294" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">不适用： 约束不可信代码——它还在你的机器上跑</text>
<rect x="380" y="110" width="300" height="216" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="530" y="142" font-size="15.5" fill="#7f1d1d" text-anchor="middle" font-weight="700">沙箱</text>
<text x="530" y="164" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">套在落地执行上的笼子</text>
<text x="396" y="198" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">隔： 当前工作目录之外的一切（含网络）</text>
<text x="396" y="230" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">共享： 同一台机器、同一个文件系统</text>
<text x="396" y="262" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">适用： 限制单个执行者的破坏半径</text>
<text x="396" y="294" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">不适用： 提供并行能力——它只管边界</text>
<rect x="720" y="110" width="300" height="216" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
<text x="870" y="142" font-size="15.5" fill="#134e4a" text-anchor="middle" font-weight="700">环境隔离</text>
<text x="870" y="164" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">容器 / 微型虚拟机</text>
<text x="736" y="198" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">隔： 文件系统、进程、网络</text>
<text x="736" y="230" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">共享： 只共享宿主的硬件</text>
<text x="736" y="262" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">适用： 云端任务、不可信代码</text>
<text x="736" y="294" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">不适用： 日常本机——启动与调试成本高一个量级</text>
<text x="40" y="372" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">目录隔离的关键性质：真正的冲突不会消失，只是被推迟到交回那一刻由 git 诚实地暴露。</text>
<text x="40" y="396" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">这是特性不是缺陷——并行工作本来就会产生冲突，能做的是让它在一个明确的时刻、以可处理的形式出现，</text>
<text x="40" y="418" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">而不是以「文件被静默覆盖」的形式消失。</text>
<text x="40" y="452" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">工作目录由 harness 在会话启动时定，模型没有「创建工作目录」这个工具——目录归属属于编排层的决定。</text>
</svg>
