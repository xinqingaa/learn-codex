<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">文本合并与配置解析是两条独立的路</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">一条决定模型读到什么，一条决定这次调用是什么参数；混成一件事，硬约束就会被降级成建议</text>
<rect x="64" y="150" width="700" height="400" rx="16" fill="#eef3fc" stroke="#3268bf" stroke-width="2.4"/>
<circle cx="114" cy="196" r="24" fill="#ffffff" stroke="#3268bf" stroke-width="1.6"/>
<g transform="translate(99.6,181.6) scale(1.2)" fill="none" stroke="#3268bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M5,2 H15 L19,6 V22 H5 Z"/><path d="M15,2 V6 H19"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/>
</g>
<text x="154" y="202" font-size="20" fill="#1d3a66" text-anchor="start" font-weight="700">文本合并 → 指令字符串</text>
<rect x="94" y="240" width="640" height="62" rx="8" fill="#eef3fc" stroke="#3268bf" stroke-width="1.8"/>
<text x="114" y="266" font-size="15" fill="#1d3a66" text-anchor="start" font-weight="650">内置基础指令</text>
<text x="114" y="288" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">永远在最前：身份、工具用法</text>
<line x1="414.0" y1="302" x2="414.0" y2="316" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="94" y="316" width="640" height="62" rx="8" fill="#faf3e7" stroke="#97691f" stroke-width="1.8"/>
<text x="114" y="342" font-size="15" fill="#5c400f" text-anchor="start" font-weight="650">项目约定（逐目录收集）</text>
<text x="114" y="364" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">从项目根一路走到当前工作目录</text>
<line x1="414.0" y1="378" x2="414.0" y2="392" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="94" y="392" width="640" height="62" rx="8" fill="#faf3e7" stroke="#97691f" stroke-width="1.8"/>
<text x="114" y="418" font-size="15" fill="#5c400f" text-anchor="start" font-weight="650">拼接顺序 = 覆盖顺序</text>
<text x="114" y="440" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">越靠近当前目录的出现在越后面，因此赢</text>
<text x="94" y="498" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">monorepo 例：根写「全部用 TypeScript」，子包写「这个包是 Python」——后者赢。</text>
<text x="94" y="522" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">整份拼接有字节上限，超了就停止追加。</text>
<rect x="836" y="150" width="700" height="400" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<circle cx="886" cy="196" r="24" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(871.6,181.6) scale(1.2)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.4" fill="#fff"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.4" fill="#fff"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2.4" fill="#fff"/>
</g>
<text x="926" y="202" font-size="20" fill="#334155" text-anchor="start" font-weight="700">配置解析 → 一组取值</text>
<rect x="866" y="240" width="640" height="34" rx="6" fill="#fbecec" stroke="#bd5254" stroke-width="1.6"/>
<text x="884" y="262" font-size="13" fill="#7a2f31" text-anchor="start" font-weight="600">命令行参数与显式覆盖</text>
<text x="1490" y="262" font-size="12" fill="#5b6b67" text-anchor="end" font-weight="400">最高</text>
<rect x="866" y="284" width="640" height="34" rx="6" fill="#faf3e7" stroke="#97691f" stroke-width="1.6"/>
<text x="884" y="306" font-size="13" fill="#5c400f" text-anchor="start" font-weight="600">项目级配置（需项目可信 · 越近越优先）</text>
<rect x="866" y="328" width="640" height="34" rx="6" fill="#eef3fc" stroke="#3268bf" stroke-width="1.6"/>
<text x="884" y="350" font-size="13" fill="#1d3a66" text-anchor="start" font-weight="600">选中的预设文件</text>
<rect x="866" y="372" width="640" height="34" rx="6" fill="#eef3fc" stroke="#3268bf" stroke-width="1.6"/>
<text x="884" y="394" font-size="13" fill="#1d3a66" text-anchor="start" font-weight="600">用户级配置</text>
<rect x="866" y="416" width="640" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="884" y="438" font-size="13" fill="#334155" text-anchor="start" font-weight="600">系统级配置</text>
<rect x="866" y="460" width="640" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
<text x="884" y="482" font-size="13" fill="#334155" text-anchor="start" font-weight="600">内置默认值</text>
<text x="1490" y="482" font-size="12" fill="#5b6b67" text-anchor="end" font-weight="400">最低</text>
<line x1="856" y1="240" x2="856" y2="494" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="4 3"/>
<text x="852" y="372.0" font-size="10.5" fill="#5b6b67" text-anchor="end" font-weight="400">覆盖</text>
<rect x="64" y="606" width="700" height="130" rx="12" fill="#fbecec" stroke="#bd5254" stroke-width="2.4"/>
<text x="84" y="638" font-size="17" fill="#7a2f31" text-anchor="start" font-weight="650">配置不进提示词</text>
<text x="84" y="664" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">把「当前沙箱是只读，请不要写文件」拼进系统提示是错的：</text>
<text x="84" y="686" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">它把一个硬约束降级成了一句建议。</text>
<text x="84" y="708" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">沙箱该拦的不需要告诉模型；模型该知道的边界，从被拒绝时的错误信息里学。</text>
<rect x="836" y="606" width="700" height="130" rx="12" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<text x="856" y="638" font-size="17" fill="#0f4a3f" text-anchor="start" font-weight="650">两条必须显式设计的边界</text>
<text x="856" y="664" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">项目级配置需要项目被标记为可信才生效——否则克隆一个仓库就能改沙箱；</text>
<text x="856" y="686" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">即使可信，也有一组机器级键不接受下层覆盖（模型后端、认证、遥测）。</text>
<text x="856" y="708" font-size="13" fill="#5b6b67" text-anchor="start" font-weight="400">调试这类系统最有用的能力：对每个键报告它最终取值来自哪一层。</text>
</svg>
