<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<style>text{font-family:'PingFang SC','Hiragino Sans GB','Heiti SC','Microsoft YaHei',sans-serif;letter-spacing:0}</style>
<defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#b7c0bd"/></marker><marker id="arr-r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#bd5254"/></marker><marker id="arr-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#177b65"/></marker><marker id="arr-b" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#3268bf"/></marker></defs>
<rect width="1600" height="820" fill="#ffffff"/>
<text x="64" y="68" font-size="32" fill="#1f2a28" text-anchor="start" font-weight="650">同一个循环，换驱动方与出口</text>
<text x="64" y="100" font-size="17" fill="#5b6b67" text-anchor="start" font-weight="400">无人值守不改变循环，改变的是三样东西：谁驱动它、它指向什么、结果怎么回来</text>
<rect x="64" y="150" width="300" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="104" cy="187.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(92.0,175.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M3,5 H21 V16 H9 L4,20 V16 H3 Z"/>
</g>
<text x="138" y="180" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">人</text>
<text x="138" y="202" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">终端里敲提示词</text>
<line x1="364" y1="187.0" x2="420" y2="187.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="242" width="300" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="104" cy="279.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(92.0,267.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M12,6.5 V12 L16,14.5"/>
</g>
<text x="138" y="272" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">定时器</text>
<text x="138" y="294" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">系统定时器 / 应用调度</text>
<line x1="364" y1="279.0" x2="420" y2="279.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="334" width="300" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="104" cy="371.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(92.0,359.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6,9 L10,12 L6,15"/><line x1="12" y1="15" x2="17" y2="15"/>
</g>
<text x="138" y="364" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">CI</text>
<text x="138" y="386" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">在某个 runner 上跑一次</text>
<line x1="364" y1="371.0" x2="420" y2="371.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="426" width="300" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="104" cy="463.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(92.0,451.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M7,18 A4.5,4.5 0 0 1 6.5,9.1 A6,6 0 0 1 18,8.4 A4.5,4.5 0 0 1 18,18 Z"/>
</g>
<text x="138" y="456" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">云端</text>
<text x="138" y="478" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">托管环境里的一个任务</text>
<line x1="364" y1="463.0" x2="420" y2="463.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="64" y="518" width="300" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="104" cy="555.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(92.0,543.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6,6 V18"/><path d="M6,12 H16"/>
</g>
<text x="138" y="548" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">另一个 agent</text>
<text x="138" y="570" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">把「跑一个任务」当成一次工具调用</text>
<line x1="364" y1="555.0" x2="420" y2="555.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="420" y="140" width="300" height="462" rx="18" fill="#eef3fc" stroke="#3268bf" stroke-width="2.6"/>
<text x="570.0" y="196" font-size="24" fill="#1d3a66" text-anchor="middle" font-weight="700">同一个循环</text>
<text x="570.0" y="222" font-size="14" fill="#5b6b67" text-anchor="middle" font-weight="400">一行不改</text>
<text x="450" y="270" font-size="15" fill="#1f2a28" text-anchor="start" font-weight="650">指向什么：</text>
<text x="450" y="300" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">· 一段对话</text>
<text x="450" y="326" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">· 一个 diff</text>
<text x="450" y="352" font-size="14" fill="#5b6b67" text-anchor="start" font-weight="400">· 一个被委派的任务</text>
<text x="570.0" y="572" font-size="13" fill="#42315e" text-anchor="middle" font-weight="600">换一份系统提示 + 换指向 = 换一个产品</text>
<line x1="720" y1="371.0" x2="776" y2="371.0" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="776" y="150" width="760" height="74" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.4"/>
<circle cx="816" cy="187.0" r="20" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<g transform="translate(804.0,175.0) scale(1.0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6,9 L10,12 L6,15"/><line x1="12" y1="15" x2="17" y2="15"/>
</g>
<text x="850" y="180" font-size="15.5" fill="#334155" text-anchor="start" font-weight="650">终端文本</text>
<text x="850" y="202" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">对人友好，对脚本是灾难</text>
<polyline points="720,371.0 746,371.0 746,187.0 776,187.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="776" y="242" width="760" height="74" rx="14" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="816" cy="279.0" r="20" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(804.0,267.0) scale(1.0)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M5,2 H15 L19,6 V22 H5 Z"/><path d="M15,2 V6 H19"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/>
</g>
<text x="850" y="272" font-size="15.5" fill="#0f4a3f" text-anchor="start" font-weight="650">结构化事件流</text>
<text x="850" y="294" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">每行一个 JSON：会话/轮次/项/用量/失败</text>
<polyline points="720,371.0 746,371.0 746,279.0 776,279.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="776" y="334" width="760" height="74" rx="14" fill="#eaf5f1" stroke="#177b65" stroke-width="2.4"/>
<circle cx="816" cy="371.0" r="20" fill="#ffffff" stroke="#177b65" stroke-width="1.6"/>
<g transform="translate(804.0,359.0) scale(1.0)" fill="none" stroke="#177b65" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9.5"/><path d="M7.5,12.5 L10.3,15.3 L16.5,8.5"/>
</g>
<text x="850" y="364" font-size="15.5" fill="#0f4a3f" text-anchor="start" font-weight="650">受 schema 约束的结果</text>
<text x="850" y="386" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">在生成阶段约束，不是事后校验重试</text>
<polyline points="720,371.0 746,371.0 746,371.0 776,371.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="776" y="426" width="760" height="74" rx="14" fill="#faf3e7" stroke="#97691f" stroke-width="2.4"/>
<circle cx="816" cy="463.0" r="20" fill="#ffffff" stroke="#97691f" stroke-width="1.6"/>
<g transform="translate(804.0,451.0) scale(1.0)" fill="none" stroke="#97691f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<rect x="4" y="3" width="16" height="19" rx="2"/><rect x="9" y="1.2" width="6" height="3.2" rx="1"/><line x1="7.5" y1="12" x2="16" y2="12"/><line x1="7.5" y1="16" x2="14" y2="16"/>
</g>
<text x="850" y="456" font-size="15.5" fill="#5c400f" text-anchor="start" font-weight="650">行内评论</text>
<text x="850" y="478" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">挂在 diff 的具体行上，绝不改文件</text>
<polyline points="720,371.0 746,371.0 746,463.0 776,463.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<rect x="776" y="518" width="760" height="74" rx="14" fill="#f3effa" stroke="#70579c" stroke-width="2.4"/>
<circle cx="816" cy="555.0" r="20" fill="#ffffff" stroke="#70579c" stroke-width="1.6"/>
<g transform="translate(804.0,543.0) scale(1.0)" fill="none" stroke="#70579c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="6" cy="4" r="2"/><circle cx="6" cy="20" r="2"/><circle cx="18" cy="12" r="2"/><path d="M6,6 V18"/><path d="M6,12 H16"/>
</g>
<text x="850" y="548" font-size="15.5" fill="#42315e" text-anchor="start" font-weight="650">一份 diff 或一个 PR</text>
<text x="850" y="570" font-size="12.5" fill="#5b6b67" text-anchor="start" font-weight="400">云端任务的产物</text>
<polyline points="720,371.0 746,371.0 746,555.0 776,555.0" fill="none" stroke="#b7c0bd" stroke-width="2" marker-end="url(#arr)"/>
<line x1="64" y1="628" x2="1536" y2="628" stroke="#e2e6e4" stroke-width="1.5"/>
<text x="64" y="656" font-size="14.5" fill="#1f2a28" text-anchor="start" font-weight="400">机器可读的输出走标准输出，人读的进度走标准错误——CI 里一条重定向就能把事件流存成文件，而人在终端看时两者都在。</text>
<text x="64" y="682" font-size="14.5" fill="#5c400f" text-anchor="start" font-weight="600">「只报告不修改」如果只写在提示词里，就会在某些时候被违反。正确做法是配上只读沙箱，让它物理上改不了。</text>
</svg>
