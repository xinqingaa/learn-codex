<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Rollout Persistence &amp; Resume — every turn is a JSON line on disk</text>

  <!-- Agent loop (writes) -->
  <rect x="50" y="92" width="200" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="150" y="122" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Agent loop (s01)</text>
  <text x="150" y="142" fill="#93c5fd" font-size="11" text-anchor="middle">user · calls · outputs · reply</text>

  <!-- write-through arrow -->
  <line x1="150" y1="172" x2="150" y2="206" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="232" y="192" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">append each item (write-through)</text>

  <!-- rollout.jsonl file -->
  <rect x="50" y="210" width="320" height="200" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="234" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">rollout.jsonl  ·  append-only</text>
  <rect x="66" y="248" width="288" height="28" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="76" y="266" fill="#64748b" font-size="10.5">{ "type": "session_meta", "id": "sess_…" }</text>
  <rect x="66" y="282" width="288" height="28" rx="5" fill="#f0f4ff" stroke="#c7d2fe"/>
  <text x="76" y="300" fill="#1e3a5f" font-size="10.5">{ "role": "user", "content": "…" }</text>
  <rect x="66" y="316" width="288" height="28" rx="5" fill="#f0f4ff" stroke="#c7d2fe"/>
  <text x="76" y="334" fill="#1e3a5f" font-size="10.5">{ "type": "function_call", … }</text>
  <rect x="66" y="350" width="288" height="28" rx="5" fill="#f0f4ff" stroke="#c7d2fe"/>
  <text x="76" y="368" fill="#1e3a5f" font-size="10.5">{ "type": "function_call_output", … }</text>
  <text x="210" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">one record per line · survives the process</text>

  <!-- resume box -->
  <rect x="440" y="120" width="230" height="110" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="150" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">codex resume  /  --resume</text>
  <text x="555" y="176" fill="#059669" font-size="11.5" text-anchor="middle">loadRollout() replays each line</text>
  <text x="555" y="196" fill="#059669" font-size="11.5" text-anchor="middle">back into a fresh thread</text>

  <!-- file -> resume -->
  <path d="M 370 250 C 430 240 430 210 436 190" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="452" y="250" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">read back</text>

  <!-- resumed thread box -->
  <rect x="440" y="280" width="230" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="306" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">thread rebuilt</text>
  <rect x="456" y="320" width="198" height="24" rx="5" fill="#fff" stroke="#86efac"/>
  <text x="555" y="336" fill="#065f46" font-size="10.5" text-anchor="middle">same items, same order</text>
  <text x="555" y="368" fill="#059669" font-size="11.5" text-anchor="middle">continue where it left off</text>
  <text x="555" y="388" fill="#059669" font-size="11.5" text-anchor="middle">new turns append to the same file</text>

  <!-- resume -> thread -->
  <line x1="555" y1="230" x2="555" y2="276" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">A session is an append-only JSONL log: persist each turn as it is produced.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">Resume = replay the log back into the thread.   ·   s09 Memory &amp; Sessions</text>
</svg>
