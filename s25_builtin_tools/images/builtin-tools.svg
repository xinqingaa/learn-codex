<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Tools Beyond the Shell — one registry, three kinds of tools</text>

  <!-- Model -->
  <rect x="270" y="70" width="180" height="58" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="94" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Model · Responses API</text>
  <text x="360" y="113" fill="#93c5fd" font-size="11" text-anchor="middle">emits a function_call by name</text>

  <line x1="360" y1="128" x2="360" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Tool Registry -->
  <rect x="230" y="168" width="260" height="58" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="191" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Tool Registry (from s02)</text>
  <text x="360" y="210" fill="#64748b" font-size="11" text-anchor="middle">dispatch by name · the loop never changes</text>

  <!-- three dispatch arrows -->
  <line x1="300" y1="226" x2="135" y2="286" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="360" y1="226" x2="360" y2="286" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="420" y1="226" x2="585" y2="286" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- LOCAL lane -->
  <rect x="40" y="288" width="190" height="120" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="310" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">LOCAL tools</text>
  <rect x="54" y="320" width="162" height="26" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="135" y="337" fill="#065f46" font-size="11" text-anchor="middle">shell (sandboxed)</text>
  <rect x="54" y="352" width="162" height="26" rx="6" fill="#fff" stroke="#16a34a"/>
  <text x="135" y="369" fill="#065f46" font-size="11" text-anchor="middle">view_image (-i/--image)</text>
  <line x1="135" y1="408" x2="135" y2="446" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="48" y="448" width="174" height="40" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="135" y="465" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">your machine</text>
  <text x="135" y="481" fill="#64748b" font-size="10" text-anchor="middle">approval_policy gates exec</text>

  <!-- HOSTED lane -->
  <rect x="265" y="288" width="190" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="310" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">HOSTED tools</text>
  <rect x="279" y="320" width="162" height="26" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="360" y="337" fill="#1e3a5f" font-size="11" text-anchor="middle">web_search (--search)</text>
  <rect x="279" y="352" width="162" height="26" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="360" y="369" fill="#1e3a5f" font-size="11" text-anchor="middle">image_generation</text>
  <line x1="360" y1="408" x2="360" y2="446" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="273" y="448" width="174" height="40" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="465" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">OpenAI's side</text>
  <text x="360" y="481" fill="#64748b" font-size="10" text-anchor="middle">no per-call approval</text>

  <!-- ACTION lane -->
  <rect x="490" y="288" width="190" height="120" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="585" y="310" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">ACTION tools</text>
  <rect x="504" y="320" width="162" height="26" rx="6" fill="#fff" stroke="#f59e0b"/>
  <text x="585" y="337" fill="#92400e" font-size="11" text-anchor="middle">browser_use (CDP)</text>
  <rect x="504" y="352" width="162" height="26" rx="6" fill="#fff" stroke="#f59e0b"/>
  <text x="585" y="369" fill="#92400e" font-size="11" text-anchor="middle">computer_use (GUI)</text>
  <line x1="585" y1="408" x2="585" y2="446" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="498" y="448" width="174" height="40" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585" y="465" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">browser / desktop</text>
  <text x="585" y="481" fill="#64748b" font-size="10" text-anchor="middle">feature-flag gated</text>

  <!-- footer note -->
  <rect x="40" y="500" width="640" height="30" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="519" fill="#475569" font-size="11" text-anchor="middle">Feature flags (codex features list) decide which tools get registered; the dispatch loop is the same one as s02.</text>
</svg>
