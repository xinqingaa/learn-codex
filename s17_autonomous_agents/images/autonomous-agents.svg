<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Self-claiming workers — scan unlocked, claim inside the lock</text>

  <!-- root seeds: x=160..560 y=60..112 -->
  <rect x="160" y="60" width="400" height="52" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="82" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">root</text>
  <text x="360" y="100" fill="#93c5fd" font-size="11" text-anchor="middle">seeds the board · does not assign</text>

  <!-- alice: x=40..240 y=184..264  cx=140 -->
  <rect x="40" y="184" width="200" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="140" y="212" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">alice</text>
  <text x="140" y="232" fill="#93c5fd" font-size="11" text-anchor="middle">WORK → IDLE → poll</text>
  <text x="140" y="250" fill="#93c5fd" font-size="11" text-anchor="middle">teaching worker, not spawn_agent</text>

  <!-- bob: x=480..680 y=184..264  cx=580 -->
  <rect x="480" y="184" width="200" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="580" y="212" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">bob</text>
  <text x="580" y="232" fill="#93c5fd" font-size="11" text-anchor="middle">WORK → IDLE → poll</text>
  <text x="580" y="250" fill="#93c5fd" font-size="11" text-anchor="middle">same loop, concurrent claim</text>

  <!-- claim critical section between workers: x=268..452 y=188..260 -->
  <rect x="268" y="188" width="184" height="72" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="216" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">claim(id, owner)</text>
  <text x="360" y="236" fill="#7c3aed" font-size="11" text-anchor="middle">locked re-check · one winner</text>

  <!-- board: x=180..540 y=320..432 -->
  <rect x="180" y="320" width="360" height="112" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="342" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">s12 TaskBoard (teaching)</text>
  <text x="360" y="362" fill="#059669" font-size="11" text-anchor="middle">t1 pending · t2 pending · t3 blocked by t1+t2</text>
  <text x="360" y="382" fill="#047857" font-size="11" text-anchor="middle">scan = clue · claim = promise</text>
  <text x="360" y="404" fill="#047857" font-size="11" text-anchor="middle">loser re-scans · does not retry the same row</text>
  <text x="360" y="420" fill="#047857" font-size="10" text-anchor="middle">Codex has no such board</text>

  <!-- seed: root RIGHT → outer rail → board RIGHT -->
  <path d="M 560 86 L 700 86 L 700 376 L 540 376" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="688" y="200" fill="#2563eb" font-size="11" font-weight="600" text-anchor="end">seed</text>

  <!-- scan: worker RIGHT/LEFT into claim at y=224 -->
  <path d="M 240 224 L 268 224" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="254" y="176" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">scan</text>
  <path d="M 480 224 L 452 224" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="466" y="176" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">scan</text>

  <!-- claim writes down into the board -->
  <path d="M 360 260 L 360 320" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="372" y="296" fill="#16a34a" font-size="11" font-weight="600">write owner</text>
  <text x="140" y="296" fill="#d97706" font-size="11" font-weight="600" text-anchor="middle">race LOST → re-scan</text>

  <rect x="60" y="448" width="600" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="474" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Codex still parent-assigns (spawn_agent / followup). This chapter races two loops on s12's board.</text>
  <text x="360" y="496" fill="#64748b" font-size="11" text-anchor="middle">s17 · Autonomous Agents  ·  teaching pull · Cloud isolation is s18</text>
</svg>
