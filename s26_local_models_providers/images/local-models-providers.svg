<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Local Models &amp; Custom Providers — one loop, any backend</text>

  <!-- The one agent loop -->
  <rect x="230" y="76" width="260" height="60" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="100" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">The agent loop (s01)</text>
  <text x="360" y="120" fill="#93c5fd" font-size="11" text-anchor="middle">provider-agnostic · speaks Responses items</text>

  <!-- wire_api adapter -->
  <rect x="230" y="176" width="260" height="74" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="196" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">wire_api adapter</text>
  <rect x="246" y="206" width="112" height="32" rx="6" fill="#fff" stroke="#2563eb"/>
  <text x="302" y="226" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">"responses"</text>
  <rect x="362" y="206" width="112" height="32" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="418" y="220" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">"chat"</text>
  <text x="418" y="233" fill="#92400e" font-size="8.5" text-anchor="middle">(removed in Codex)</text>

  <!-- loop -> adapter -->
  <line x1="360" y1="136" x2="360" y2="172" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- adapter -> providers fan out -->
  <line x1="302" y1="238" x2="108" y2="316" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="330" y1="250" x2="276" y2="316" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="392" y1="250" x2="444" y2="316" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="418" y1="238" x2="612" y2="316" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Provider boxes -->
  <rect x="36" y="320" width="144" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="108" y="342" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">OpenAI</text>
  <text x="108" y="359" fill="#64748b" font-size="10" text-anchor="middle">api.openai.com/v1</text>
  <text x="108" y="374" fill="#64748b" font-size="10" text-anchor="middle">env OPENAI_API_KEY</text>

  <rect x="204" y="320" width="144" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="276" y="342" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">Corp Gateway</text>
  <text x="276" y="359" fill="#64748b" font-size="10" text-anchor="middle">[model_providers.x]</text>
  <text x="276" y="374" fill="#64748b" font-size="10" text-anchor="middle">base_url · env_key</text>

  <rect x="372" y="320" width="144" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="444" y="342" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">Ollama (local)</text>
  <text x="444" y="359" fill="#059669" font-size="10" text-anchor="middle">localhost:11434/v1</text>
  <text x="444" y="374" fill="#059669" font-size="10" text-anchor="middle">--oss · gpt-oss:20b</text>

  <rect x="540" y="320" width="144" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="612" y="342" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">Chat-only backend</text>
  <text x="612" y="359" fill="#b45309" font-size="10" text-anchor="middle">/chat/completions</text>
  <text x="612" y="374" fill="#b45309" font-size="10" text-anchor="middle">via translation proxy</text>

  <!-- lmstudio note -->
  <text x="444" y="408" fill="#059669" font-size="10" text-anchor="middle">lmstudio → localhost:1234/v1</text>

  <!-- footer note -->
  <rect x="60" y="446" width="600" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="470" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Swap the provider or the wire_api — the loop never changes.</text>
  <text x="360" y="490" fill="#64748b" font-size="11" text-anchor="middle">Current Codex speaks Responses only; a chat-only backend needs a translation proxy (e.g. LiteLLM).</text>
  <text x="360" y="508" fill="#64748b" font-size="11" text-anchor="middle">s26 · Local Models &amp; Custom Providers</text>
</svg>
