<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Codex as a Service — one engine, many frontends</text>

  <!-- top: three app-server-protocol frontends -->
  <g font-size="11">
    <rect x="90" y="64" width="150" height="48" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="165" y="85" fill="#075985" font-weight="600" text-anchor="middle">codex app</text>
    <text x="165" y="101" fill="#64748b" font-size="10" text-anchor="middle">desktop app</text>

    <rect x="285" y="64" width="150" height="48" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="360" y="85" fill="#075985" font-weight="600" text-anchor="middle">VS Code</text>
    <text x="360" y="101" fill="#64748b" font-size="10" text-anchor="middle">extension</text>

    <rect x="480" y="64" width="150" height="48" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="555" y="85" fill="#075985" font-weight="600" text-anchor="middle">codex --remote</text>
    <text x="555" y="101" fill="#64748b" font-size="10" text-anchor="middle">ws://… (remote TUI)</text>
  </g>

  <!-- top gateway: the app-server protocol -->
  <rect x="255" y="150" width="210" height="58" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="360" y="171" fill="#155e75" font-size="12" font-weight="700" text-anchor="middle">AppServer · JSON-RPC</text>
  <text x="360" y="187" fill="#0e7490" font-size="10.5" text-anchor="middle">codex app-server · stdio/unix/ws</text>
  <text x="360" y="201" fill="#0e7490" font-size="10" text-anchor="middle">thread/start · turn/start</text>

  <!-- arrows: frontends -> app-server gateway -->
  <line x1="165" y1="112" x2="320" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="360" y1="112" x2="360" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="555" y1="112" x2="400" y2="148" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- left: in-process TUI -->
  <rect x="40" y="262" width="180" height="64" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="288" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">codex (TUI)</text>
  <text x="130" y="306" fill="#b45309" font-size="10.5" text-anchor="middle">in-process — no wire</text>

  <!-- right: MCP server gateway -->
  <rect x="500" y="170" width="180" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="590" y="188" fill="#334155" font-size="11" font-weight="600" text-anchor="middle">any MCP client</text>
  <text x="590" y="203" fill="#64748b" font-size="10" text-anchor="middle">(other agents, tools)</text>

  <rect x="500" y="262" width="180" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="284" fill="#065f46" font-size="12" font-weight="700" text-anchor="middle">McpServer</text>
  <text x="590" y="301" fill="#059669" font-size="10.5" text-anchor="middle">codex mcp-server</text>
  <text x="590" y="317" fill="#059669" font-size="10" text-anchor="middle">tools: codex · codex-reply</text>

  <!-- center: the one engine -->
  <rect x="275" y="250" width="170" height="96" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="278" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ONE CodexEngine</text>
  <text x="360" y="298" fill="#93c5fd" font-size="11" text-anchor="middle">session store +</text>
  <text x="360" y="314" fill="#93c5fd" font-size="11" text-anchor="middle">agent loop (s01)</text>

  <!-- bottom: hosted surfaces -->
  <rect x="255" y="400" width="210" height="58" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="360" y="422" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">ChatGPT Codex</text>
  <text x="360" y="438" fill="#2563eb" font-size="10.5" text-anchor="middle">@codex on GitHub · hosted</text>
  <text x="360" y="451" fill="#64748b" font-size="9.5" text-anchor="middle">same engine, see s23</text>

  <!-- arrows into the engine -->
  <line x1="360" y1="208" x2="360" y2="248" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="220" y1="294" x2="273" y2="294" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="214" x2="590" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="447" y2="296" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="360" y1="400" x2="360" y2="348" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- footer -->
  <rect x="60" y="486" width="600" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="504" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Every frontend drives the SAME engine + session store — only the transport differs.</text>
  <text x="360" y="521" fill="#64748b" font-size="11" text-anchor="middle">s27 · Codex as a Service</text>
</svg>
