<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Scheduled Runs — the harness decides WHEN to act</text>

  <!-- Simulated clock -->
  <rect x="48" y="92" width="150" height="60" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="123" y="116" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Clock</text>
  <text x="123" y="134" fill="#64748b" font-size="11" text-anchor="middle">tick = one minute</text>

  <!-- Scheduler / cron matcher -->
  <rect x="262" y="84" width="196" height="76" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="108" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Scheduler</text>
  <text x="360" y="126" fill="#93c5fd" font-size="11" text-anchor="middle">cronMatches(expr, now)</text>
  <text x="360" y="144" fill="#93c5fd" font-size="11" text-anchor="middle">automations registry</text>

  <!-- Queue -->
  <rect x="522" y="92" width="150" height="60" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="597" y="116" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">Fired Queue</text>
  <text x="597" y="134" fill="#d97706" font-size="11" text-anchor="middle">triggered tasks</text>

  <!-- Dispatcher -->
  <rect x="522" y="220" width="150" height="68" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="597" y="246" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Dispatcher</text>
  <text x="597" y="264" fill="#64748b" font-size="11" text-anchor="middle">agent idle? dequeue</text>

  <!-- Agent loop -->
  <rect x="150" y="330" width="420" height="86" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="358" fill="#065f46" font-size="14" font-weight="600" text-anchor="middle">Agent Loop (unchanged since s01)</text>
  <text x="360" y="378" fill="#059669" font-size="11" text-anchor="middle">"[Scheduled] task" → callModel → run tool → feed result back</text>
  <text x="360" y="398" fill="#059669" font-size="11" text-anchor="middle">one full turn per fired automation</text>

  <!-- clock -> scheduler -->
  <line x1="198" y1="122" x2="258" y2="122" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="228" y="112" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">tick</text>
  <!-- scheduler -> queue -->
  <line x1="458" y1="122" x2="518" y2="122" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="488" y="112" fill="#d97706" font-size="11" font-weight="600" text-anchor="middle">match → enqueue</text>
  <!-- queue -> dispatcher -->
  <line x1="597" y1="152" x2="597" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- dispatcher -> agent loop -->
  <path d="M 522 254 L 360 254 L 360 326" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="438" y="244" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">run a full turn</text>

  <!-- decoupling note -->
  <rect x="48" y="220" width="300" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="198" y="244" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Producer / consumer decoupled</text>
  <text x="198" y="262" fill="#64748b" font-size="11" text-anchor="middle">scheduler never runs the agent;</text>
  <text x="198" y="278" fill="#64748b" font-size="11" text-anchor="middle">dispatcher never checks the time</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Time-driven trigger + the same agent loop = an automation. No human in the loop.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s14 · Automations</text>
</svg>
