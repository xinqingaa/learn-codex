<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Automations — alarm clock outside the loop</text>

  <rect x="40" y="80" width="140" height="56" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="102" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Clock</text>
  <text x="110" y="120" fill="#64748b" font-size="11" text-anchor="middle">tick = one minute</text>

  <rect x="220" y="72" width="200" height="72" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="320" y="96" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Scheduler</text>
  <text x="320" y="114" fill="#93c5fd" font-size="11" text-anchor="middle">due now? enqueue</text>
  <text x="320" y="130" fill="#93c5fd" font-size="11" text-anchor="middle">never runs the agent</text>

  <rect x="460" y="80" width="220" height="56" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="570" y="102" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">Fired Queue</text>
  <text x="570" y="120" fill="#d97706" font-size="11" text-anchor="middle">cron · heartbeat</text>

  <line x1="180" y1="108" x2="216" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="420" y1="108" x2="456" y2="108" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="460" y="168" width="220" height="52" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="190" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">Dispatcher</text>
  <text x="570" y="206" fill="#64748b" font-size="11" text-anchor="middle">idle → branch on kind</text>
  <line x1="570" y1="136" x2="570" y2="164" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- two kinds -->
  <rect x="40" y="248" width="300" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="190" y="272" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">kind = cron</text>
  <text x="190" y="292" fill="#059669" font-size="11" text-anchor="middle">fresh turn · like codex exec</text>
  <text x="190" y="306" fill="#059669" font-size="11" text-anchor="middle">findings → inbox / Triage</text>

  <rect x="380" y="248" width="300" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="272" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">kind = heartbeat</text>
  <text x="530" y="292" fill="#7c3aed" font-size="11" text-anchor="middle">same thread · keep context</text>
  <text x="530" y="306" fill="#7c3aed" font-size="11" text-anchor="middle">append prompt and continue</text>

  <path d="M 500 220 C 420 220 280 220 190 244" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 600 220 L 600 232 L 530 244" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="150" y="348" width="420" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="376" fill="#334155" font-size="14" font-weight="600" text-anchor="middle">Agent Loop (unchanged since s01)</text>
  <text x="360" y="396" fill="#64748b" font-size="11" text-anchor="middle">the loop does not watch the clock — it only receives a user message</text>

  <path d="M 190 318 L 190 340 L 280 348" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 530 318 L 530 340 L 440 348" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <rect x="40" y="448" width="640" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="474" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">CLI has no scheduler — only codex exec. The App owns RRULE + these two kinds.</text>
  <text x="360" y="494" fill="#64748b" font-size="11" text-anchor="middle">s14 · Automations · alarm clock outside the loop</text>
</svg>
