<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">The Full Harness — every mechanism is a layer around the same loop</text>

  <!-- memory layer (top band, taps the loop) -->
  <rect x="70" y="66" width="580" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="86" fill="#334155" font-size="12.5" font-weight="600" text-anchor="middle">memory layer · session rollout (s09)</text>
  <text x="360" y="102" fill="#64748b" font-size="11" text-anchor="middle">persist every turn to rollout.jsonl → codex resume</text>

  <!-- s01 loop (center) -->
  <rect x="70" y="132" width="580" height="88" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="158" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">s01 AGENT LOOP — unchanged</text>
  <text x="360" y="178" fill="#93c5fd" font-size="12" text-anchor="middle">model → function_call? → run tool → feed result back</text>
  <text x="360" y="198" fill="#6b7280" font-size="11" text-anchor="middle">the loop decides nothing about policy; it just runs what the model asks</text>

  <!-- memory tap arrow (loop -> memory) -->
  <path d="M 96 132 C 96 122 96 118 96 112" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="120" y="124" fill="#64748b" font-size="10" font-weight="600">every turn</text>

  <!-- tool-call flow: loop -> down into dispatch layers -->
  <line x1="200" y1="220" x2="200" y2="246" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="212" y="238" fill="#2563eb" font-size="11" font-weight="600">tool call</text>
  <line x1="520" y1="246" x2="520" y2="220" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="530" y="238" fill="#16a34a" font-size="11" font-weight="600">function_call_output</text>

  <!-- sandbox layer -->
  <rect x="90" y="250" width="540" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="360" y="270" fill="#991b1b" font-size="12.5" font-weight="600" text-anchor="middle">sandbox layer (s04) · sandbox_mode = workspace-write</text>
  <text x="360" y="286" fill="#b91c1c" font-size="11" text-anchor="middle">writes outside the workspace are refused</text>

  <!-- approval layer -->
  <rect x="110" y="304" width="500" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="324" fill="#92400e" font-size="12.5" font-weight="600" text-anchor="middle">approval layer (s03) · approval_policy = on-request</text>
  <text x="360" y="340" fill="#b45309" font-size="11" text-anchor="middle">may this command run at all? pause for a human if needed</text>

  <!-- tool registry -->
  <rect x="130" y="358" width="460" height="112" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="378" fill="#1e3a5f" font-size="12.5" font-weight="600" text-anchor="middle">tool registry (s02) — dispatch by name</text>

  <!-- tool chips row 1 -->
  <rect x="150" y="390" width="130" height="30" rx="6" fill="#fff" stroke="#60a5fa"/>
  <text x="215" y="409" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">shell · write_file</text>
  <rect x="295" y="390" width="130" height="30" rx="6" fill="#fdf4ff" stroke="#c084fc"/>
  <text x="360" y="409" fill="#7e22ce" font-size="11" font-weight="600" text-anchor="middle">update_plan (s05)</text>
  <rect x="440" y="390" width="130" height="30" rx="6" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="505" y="409" fill="#0e7490" font-size="11" font-weight="600" text-anchor="middle">spawn_subagent</text>

  <!-- tool chips row 2 -->
  <rect x="215" y="428" width="150" height="30" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="290" y="447" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">mcp__docs__search</text>
  <rect x="380" y="428" width="110" height="30" rx="6" fill="#f0f9ff" stroke="#38bdf8"/>
  <text x="435" y="447" fill="#075985" font-size="11" font-weight="600" text-anchor="middle">(s06 · s19)</text>

  <!-- footer note -->
  <rect x="60" y="484" width="600" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="503" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Some mechanisms are tools, some are dispatch layers, memory wraps the model call.</text>
  <text x="360" y="519" fill="#64748b" font-size="11" text-anchor="middle">All surround the same s01 loop · s20 · Full Harness</text>
</svg>
