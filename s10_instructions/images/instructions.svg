<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Instruction Assembly — base + AGENTS.md + config.toml → one system prompt</text>

  <!-- Layer 1: built-in base -->
  <rect x="40" y="96" width="240" height="70" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="160" y="124" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">built-in base</text>
  <text x="160" y="144" fill="#93c5fd" font-size="11" text-anchor="middle">ships with the harness · always on</text>

  <!-- Layer 2: AGENTS.md -->
  <rect x="40" y="196" width="240" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="224" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">AGENTS.md</text>
  <text x="160" y="244" fill="#2563eb" font-size="11" text-anchor="middle">project rules · appended after base</text>

  <!-- Layer 3: config.toml -->
  <rect x="40" y="296" width="240" height="86" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="160" y="322" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">config.toml profile</text>
  <text x="160" y="342" fill="#b45309" font-size="11" text-anchor="middle">model · reasoning effort</text>
  <text x="160" y="360" fill="#b45309" font-size="11" text-anchor="middle">approval · sandbox · providers</text>

  <!-- merge / resolve box -->
  <rect x="330" y="180" width="160" height="120" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="410" y="214" fill="#111827" font-size="13" font-weight="700" text-anchor="middle">assemble</text>
  <text x="410" y="238" fill="#334155" font-size="11" text-anchor="middle">merge text layers</text>
  <text x="410" y="258" fill="#334155" font-size="11" text-anchor="middle">resolve precedence</text>
  <text x="410" y="282" fill="#64748b" font-size="10" text-anchor="middle">flag &gt; profile &gt; root &gt; default</text>

  <!-- arrows: layers -> assemble -->
  <line x1="280" y1="131" x2="344" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="231" x2="328" y2="231" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="280" y1="339" x2="344" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output box -->
  <rect x="520" y="160" width="160" height="160" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="188" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">Responses API call</text>
  <rect x="534" y="202" width="132" height="30" rx="5" fill="#fff" stroke="#86efac"/>
  <text x="600" y="222" fill="#065f46" font-size="10.5" text-anchor="middle">instructions (merged)</text>
  <rect x="534" y="238" width="132" height="30" rx="5" fill="#fff" stroke="#86efac"/>
  <text x="600" y="258" fill="#065f46" font-size="10.5" text-anchor="middle">model (resolved)</text>
  <rect x="534" y="274" width="132" height="30" rx="5" fill="#fff" stroke="#86efac"/>
  <text x="600" y="294" fill="#065f46" font-size="10.5" text-anchor="middle">reasoning.effort</text>

  <!-- assemble -> output -->
  <line x1="490" y1="240" x2="518" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- precedence strip -->
  <rect x="40" y="410" width="640" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="434" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Text: base then AGENTS.md appended.   Settings: env / CLI flag overrides profile, which overrides config root.</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">The system prompt is built at runtime from layers, not hardcoded — swap the</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">project or profile and the same harness behaves differently.   ·   s10 Instructions</text>
</svg>
