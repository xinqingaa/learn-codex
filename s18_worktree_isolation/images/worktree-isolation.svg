<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Git Worktree Isolation — one directory + branch per task</text>

  <!-- main repo -->
  <rect x="42" y="112" width="168" height="96" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="126" y="138" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">repo · main</text>
  <text x="126" y="158" fill="#93c5fd" font-size="11" text-anchor="middle">app.txt = "base"</text>
  <text x="126" y="176" fill="#64748b" font-size="10" text-anchor="middle">(.git is shared)</text>

  <!-- worktree t1 -->
  <rect x="478" y="70" width="206" height="64" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="581" y="94" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">wt-t1/ · branch wt/t1</text>
  <text x="581" y="112" fill="#059669" font-size="11" text-anchor="middle">app.txt = base + alice</text>
  <text x="581" y="127" fill="#64748b" font-size="10" text-anchor="middle">alice edits here</text>

  <!-- worktree t2 -->
  <rect x="478" y="162" width="206" height="64" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="581" y="186" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">wt-t2/ · branch wt/t2</text>
  <text x="581" y="204" fill="#059669" font-size="11" text-anchor="middle">app.txt = base + bob</text>
  <text x="581" y="219" fill="#64748b" font-size="10" text-anchor="middle">bob edits here</text>

  <!-- isolation callout -->
  <rect x="238" y="120" width="206" height="80" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="341" y="146" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">disjoint directories</text>
  <text x="341" y="164" fill="#92400e" font-size="11" text-anchor="middle">SAME path, DIFFERENT</text>
  <text x="341" y="180" fill="#92400e" font-size="11" text-anchor="middle">content — no clobber</text>

  <!-- arrows: create worktrees -->
  <line x1="210" y1="140" x2="476" y2="104" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="330" y="104" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">git worktree add -b wt/t1</text>
  <line x1="210" y1="180" x2="476" y2="192" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="330" y="220" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">git worktree add -b wt/t2</text>

  <!-- merge outcomes -->
  <rect x="70" y="330" width="262" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="201" y="356" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">merge wt/t1 → clean ✓</text>
  <text x="201" y="376" fill="#059669" font-size="11" text-anchor="middle">worktree removed, branch deleted</text>

  <rect x="392" y="330" width="272" height="70" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="528" y="356" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">merge wt/t2 → CONFLICT ✗</text>
  <text x="528" y="376" fill="#b45309" font-size="11" text-anchor="middle">merge --abort → keep branch for review (PR)</text>

  <!-- arrows: merge back -->
  <path d="M 581 134 C 581 260 300 290 215 328" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 581 226 C 581 300 560 310 545 328" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="420" y="300" fill="#555" font-size="10" text-anchor="middle">each branch merges back into main when its task is done</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Parallel edits never collide in disjoint directories; git surfaces real conflicts at merge time.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s18 · Worktree Isolation (the Codex Cloud model)</text>
</svg>
