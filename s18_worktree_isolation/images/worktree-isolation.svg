<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Git Worktree Isolation — one checkout per session</text>

  <!-- repo/main: x=256..464 y=64..136  cx=360  bottom=136 -->
  <rect x="256" y="64" width="208" height="72" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="90" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">repo · main</text>
  <text x="360" y="110" fill="#93c5fd" font-size="11" text-anchor="middle">app.txt = "base"</text>
  <text x="360" y="126" fill="#64748b" font-size="10" text-anchor="middle">(.git is shared)</text>

  <!-- wt-t1: x=40..280 y=200..280  cx=160  top=200 bottom=280 -->
  <rect x="40" y="200" width="240" height="80" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="224" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">wt-t1/ · branch wt/t1</text>
  <text x="160" y="244" fill="#059669" font-size="11" text-anchor="middle">app.txt = base + alice</text>
  <text x="160" y="262" fill="#64748b" font-size="10" text-anchor="middle">alice writes here</text>

  <!-- wt-t2: x=440..680 y=200..280  cx=560 -->
  <rect x="440" y="200" width="240" height="80" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="560" y="224" fill="#1e3a5f" font-size="13" font-weight="600" text-anchor="middle">wt-t2/ · branch wt/t2</text>
  <text x="560" y="244" fill="#059669" font-size="11" text-anchor="middle">app.txt = base + bob</text>
  <text x="560" y="262" fill="#64748b" font-size="10" text-anchor="middle">bob writes here</text>

  <!-- callout between worktrees: x=292..428 y=212..268 -->
  <rect x="292" y="212" width="136" height="56" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="234" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">same path</text>
  <text x="360" y="252" fill="#92400e" font-size="10" text-anchor="middle">two contents</text>

  <!-- create: main BOTTOM → y=168 rail → worktree TOPs -->
  <path d="M 360 136 L 360 168 L 160 168 L 160 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 360 168 L 560 168 L 560 200" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="160" y="188" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">git worktree add -b wt/t1</text>
  <text x="560" y="188" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">git worktree add -b wt/t2</text>

  <!-- merge outcomes: x=40..320 / 400..680  y=360..428  top=360 -->
  <rect x="40" y="360" width="280" height="68" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="180" y="386" fill="#065f46" font-size="13" font-weight="600" text-anchor="middle">merge wt/t1 → clean</text>
  <text x="180" y="408" fill="#059669" font-size="11" text-anchor="middle">worktree removed, branch deleted</text>

  <rect x="400" y="360" width="280" height="68" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="540" y="386" fill="#92400e" font-size="13" font-weight="600" text-anchor="middle">merge wt/t2 → CONFLICT</text>
  <text x="540" y="408" fill="#b45309" font-size="11" text-anchor="middle">merge --abort · keep branch</text>

  <!-- merge: worktree BOTTOM → y=320 rail → outcome TOPs (cx 180 / 540) -->
  <path d="M 160 280 L 160 320 L 180 320 L 180 360" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 560 280 L 560 320 L 540 320 L 540 360" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="360" y="314" fill="#555" font-size="10" text-anchor="middle">teaching merge — Codex does not auto-merge into main</text>

  <rect x="60" y="452" width="600" height="68" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="478" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Parallel edits never collide in disjoint directories; git surfaces real conflicts at merge time.</text>
  <text x="360" y="500" fill="#64748b" font-size="11" text-anchor="middle">s18 · Worktree Isolation  ·  local App/CLI checkouts  ·  Cloud containers are s23</text>
</svg>
