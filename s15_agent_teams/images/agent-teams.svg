<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Teammate Mailboxes — share information, not a context</text>

  <!-- Researcher agent -->
  <rect x="48" y="92" width="220" height="96" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="158" y="116" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">researcher</text>
  <text x="158" y="136" fill="#93c5fd" font-size="11" text-anchor="middle">own context · own loop</text>
  <text x="158" y="154" fill="#93c5fd" font-size="11" text-anchor="middle">gather_notes → send_message</text>

  <!-- Writer agent -->
  <rect x="48" y="352" width="220" height="96" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="158" y="376" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">writer</text>
  <text x="158" y="396" fill="#93c5fd" font-size="11" text-anchor="middle">own context · own loop</text>
  <text x="158" y="414" fill="#93c5fd" font-size="11" text-anchor="middle">wait_inbox → write_file</text>

  <!-- Message bus -->
  <rect x="480" y="200" width="192" height="140" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="576" y="226" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">Message Bus</text>
  <text x="576" y="246" fill="#7c3aed" font-size="11" text-anchor="middle">one inbox per teammate</text>
  <rect x="500" y="262" width="152" height="30" rx="6" fill="#fff" stroke="#c4b5fd"/>
  <text x="576" y="281" fill="#6d28d9" font-size="11" text-anchor="middle">inbox: researcher</text>
  <rect x="500" y="298" width="152" height="30" rx="6" fill="#fff" stroke="#c4b5fd"/>
  <text x="576" y="317" fill="#6d28d9" font-size="11" text-anchor="middle">inbox: writer</text>

  <!-- researcher -> bus (send_message) -->
  <path d="M 268 130 L 470 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="168" fill="#2563eb" font-size="11" font-weight="600" text-anchor="middle">send_message(findings)</text>

  <!-- bus -> writer (wait_inbox delivers) -->
  <path d="M 480 300 L 268 380" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="360" y="356" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">wait_inbox delivers</text>

  <!-- writer -> bus (notify done) -->
  <path d="M 268 410 L 470 320" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="360" y="404" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">"doc written"</text>

  <!-- shared artifact -->
  <rect x="480" y="392" width="192" height="56" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="576" y="414" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">shared artifact</text>
  <text x="576" y="432" fill="#059669" font-size="11" text-anchor="middle">agent-loop.md</text>

  <!-- footer note -->
  <rect x="60" y="470" width="600" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="492" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Each teammate keeps its own context window; messages carry only what the other needs.</text>
  <text x="360" y="510" fill="#64748b" font-size="11" text-anchor="middle">s15 · Agent Teams</text>
</svg>
