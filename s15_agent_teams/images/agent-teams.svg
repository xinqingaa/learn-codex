<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="720" height="540" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="30" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Multi-Agent V2 — spawn, send_message, wait_agent</text>

  <!-- root: x=250..470 y=68..148 -->
  <rect x="250" y="68" width="220" height="80" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="360" y="94" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">root</text>
  <text x="360" y="114" fill="#93c5fd" font-size="11" text-anchor="middle">own context · own loop</text>
  <text x="360" y="132" fill="#93c5fd" font-size="11" text-anchor="middle">spawn_agent · wait_agent</text>

  <!-- researcher: x=40..240 y=276..364  cx=140 -->
  <rect x="40" y="276" width="200" height="88" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="140" y="302" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">researcher</text>
  <text x="140" y="322" fill="#93c5fd" font-size="11" text-anchor="middle">own context · own loop</text>
  <text x="140" y="342" fill="#93c5fd" font-size="11" text-anchor="middle">gather_notes → send_message</text>

  <!-- writer: x=480..680 y=276..364  cx=580 -->
  <rect x="480" y="276" width="200" height="88" rx="8" fill="#111827" stroke="#111827" stroke-width="2"/>
  <text x="580" y="302" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">writer</text>
  <text x="580" y="322" fill="#93c5fd" font-size="11" text-anchor="middle">own context · own loop</text>
  <text x="580" y="342" fill="#93c5fd" font-size="11" text-anchor="middle">wait_agent → write_file</text>

  <!-- mailbox between children: x=268..452 y=284..356 -->
  <rect x="268" y="284" width="184" height="72" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="312" fill="#5b21b6" font-size="13" font-weight="600" text-anchor="middle">Mailbox</text>
  <text x="360" y="332" fill="#7c3aed" font-size="11" text-anchor="middle">in-process · not a file</text>

  <!-- artifact under mailbox: x=268..452 y=392..440 -->
  <rect x="268" y="392" width="184" height="48" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="360" y="412" fill="#065f46" font-size="12" font-weight="600" text-anchor="middle">shared artifact</text>
  <text x="360" y="428" fill="#059669" font-size="11" text-anchor="middle">agent-loop.md</text>

  <!-- spawn_agent: two ports on root's BOTTOM, then out to each child top -->
  <path d="M 290 148 L 290 172 L 140 172 L 140 276" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="148" y="224" fill="#2563eb" font-size="11" font-weight="600">spawn_agent</text>
  <path d="M 430 148 L 430 172 L 580 172 L 580 276" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="588" y="224" fill="#2563eb" font-size="11" font-weight="600">spawn_agent</text>

  <!-- send_message / wait_agent: short horizontal into mailbox left/right -->
  <path d="M 240 320 L 268 320" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="254" y="262" fill="#7c3aed" font-size="11" font-weight="600" text-anchor="middle">send_message</text>
  <path d="M 452 320 L 480 320" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="466" y="262" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">wait_agent</text>

  <!-- final: mailbox top → root bottom, center rail between the two spawn stubs -->
  <path d="M 360 284 L 360 148" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="372" y="216" fill="#16a34a" font-size="11" font-weight="600">final</text>

  <!-- write_file: writer bottom → down → into artifact right -->
  <path d="M 580 364 L 580 416 L 452 416" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="516" y="404" fill="#16a34a" font-size="11" font-weight="600" text-anchor="middle">write_file</text>

  <rect x="60" y="460" width="600" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="482" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Children keep their own context windows; spawn returns immediately; only mail crosses.</text>
  <text x="360" y="502" fill="#64748b" font-size="11" text-anchor="middle">s15 · Agent Teams  ·  Codex Multi-Agent V2</text>
</svg>
